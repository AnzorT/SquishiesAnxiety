<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squish Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Squish Hop: a trip through the Squad Crib. Each level is one of the
   Crib's rooms (src/crib/roomArt.js layers, cut at the room's floor line),
   with the board laid on its floor in perspective: Squish Stack's stitched
   cushions (src/stack/Pieces.js), or in the Dance Room the Crib's light-up
   floor tiles (src/crib/Dance.js). The squishies stand on it as Squish
   Stack's full-body cut-outs. The top bar is the Crib's HUD
   (src/crib/Hud.js: round button, room title, time-of-day pill); the goal
   and stars sit in a brown glass strip at the bottom; the cards are the
   mini-games' own (squishdoku/Overlays.js). One look, like the app: no
   dark mode. */
:root {
  --ink: #45107a;            /* the app's deep plum */
  --brown: #5b3a29;          /* the Crib's ink (crib/Hud.js INK) */
  --glass: rgba(91, 58, 41, 0.75); /* the Crib's pills */
  --ring: #45189a;
  --pink-ink: #8e1580;
  --sub: #8a5fc0;
  --gold: #ffd23a;
  --gold-ink: #b86200;
  --white: #ffffff;
  --scene: #dba163;          /* the room's floor colour, set per room */
  --display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--scene); color: var(--ink);
  font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 999px; }

/* ---- the room */
#scene { position: fixed; inset: 0; overflow: hidden; background: var(--scene); }
#room { position: absolute; top: 0; }
#room img { position: absolute; left: 0; display: block; }
#room .clip { position: absolute; left: 0; top: 0; overflow: hidden; }
#tint { position: absolute; inset: 0; pointer-events: none; }
#flash { position: fixed; inset: 0; z-index: 70; pointer-events: none; opacity: 0; }
#flash img { position: absolute; inset: 0; width: 100%; height: 100%; }
#flash .dots { position: absolute; inset: 0; background-size: 22px 22px; }

/* ---- the column */
#app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 6px;
}

/* the Crib's top bar: round button, room title, time-of-day pill */
.top { display: flex; align-items: center; gap: 8px; position: relative; z-index: 20; }
.cribBtn { position: relative; width: 50px; height: 54px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.cribBtn .cc { position: absolute; left: 0; width: 50px; height: 50px; border-radius: 50%; background: var(--brown); }
.cribBtn .cc1 { top: 4px; }
.cribBtn .cc0 { top: 0; }
.cribBtn .cface { position: absolute; left: 2px; top: 2px; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--white); overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #ffd0f0 0%, #ff7fd0 55%, #d84aa8 100%); }
.cribBtn:active .cc0, .cribBtn:active .cface, .cribBtn.down .cc0, .cribBtn.down .cface { transform: translateY(3px); }
.titleBox { flex: 1; min-width: 0; }
.roomTitle { display: block; overflow: visible; max-width: 100%; }
.roomSub { display: flex; align-items: center; gap: 6px; margin-top: -2px; font: 900 11px/1.3 var(--body); letter-spacing: 0.6px; color: var(--white); text-shadow: 0 1px 1.5px var(--brown); white-space: nowrap; }
.chip { padding: 0 6px; border-radius: 999px; border: 2px solid var(--white); font: 700 9.5px/1.4 var(--display); letter-spacing: 0.6px; color: var(--white); text-shadow: none; }
.phase { display: flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--glass); border: 2px solid rgba(255,255,255,0.9); flex: none; }
.phase .sun { width: 9px; height: 9px; border-radius: 5px; }
.phase span:last-child { font: 900 11px/1.2 var(--body); color: var(--white); letter-spacing: 0.6px; }

/* the board on the floor */
.area { position: relative; flex: 1; min-height: 0; touch-action: none; -webkit-touch-callout: none; z-index: 5; }
.area img { pointer-events: none; -webkit-user-drag: none; }
.plane { position: absolute; transform-origin: 50% 100%; transform-style: preserve-3d; }
.plane.dance { background: #140818; border: 3px solid #2a1430; box-shadow: 0 0 0 6px rgba(255,92,198,0.3); }
.plane .rug { position: absolute; left: -16%; top: -12%; width: 132%; height: 124%; }
.tile { position: absolute; transform-style: preserve-3d; }
.tile > * { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.tile svg { display: block; overflow: visible; }
.dent { border-radius: 22%; border: 2.5px dashed var(--dent, rgba(91,58,41,0.4)); transform: scale(0.84); }
.dent.dk { border: 0; border-radius: 0; background: rgba(255,255,255,0.04); transform: none; }
.dt { background: var(--tc); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.28), 0 0 12px var(--tc); }
.dt::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 62%); }
.dt.hue { animation: hueStep 4.8s infinite; }
@keyframes hueStep { 0%, 24.99% { filter: none; } 25%, 49.99% { filter: hue-rotate(90deg); } 50%, 74.99% { filter: hue-rotate(180deg); } 75%, 100% { filter: hue-rotate(270deg); } }
.dring { border: 3px solid var(--white); box-shadow: 0 0 10px var(--white), inset 0 0 10px var(--white); transform: translateZ(1px) scale(0.62); }
.tile.hint::after {
  content: ''; position: absolute; left: -2%; top: -2%; width: 104%; height: 104%; border-radius: 24%; border: 3px solid var(--gold);
  box-shadow: 0 0 14px 2px rgba(255,226,92,0.9), inset 0 0 12px rgba(255,226,92,0.8); animation: hintPulse 0.5s ease-in-out 6 alternate;
}
@keyframes hintPulse { from { opacity: 0.45; } to { opacity: 1; } }
.tile.hint .c0 { animation: hintHop 0.5s ease-in-out 6 alternate; }
@keyframes hintHop { from { transform: translateZ(0); } to { transform: translateZ(var(--hz, 8px)); } }
.layer { position: absolute; inset: 0; pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
.piece .shadow { position: absolute; left: 14%; right: 14%; bottom: -5%; height: 15%; border-radius: 50%; background: var(--shade, rgba(69,16,122,0.28)); }
.piece .lift, .piece .squash, .piece .breathe { position: absolute; inset: 0; transform-origin: 50% 100%; }
.piece img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.breathe { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 0.97); } }
.friend .breathe { animation: breathe 2.2s ease-in-out infinite, peek 6s ease-in-out infinite; animation-delay: var(--fd), var(--fd); }
@keyframes peek { 0%, 84%, 100% { rotate: 0deg; } 88% { rotate: -9deg; } 92% { rotate: 8deg; } 96% { rotate: -3deg; } }
.goalStar { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
.goalStar .bob { position: absolute; inset: 0; animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8%); } }
.goalStar svg { display: block; width: 100%; height: 100%; transition: filter 300ms, opacity 300ms; }
.goalStar.locked svg { filter: grayscale(1) brightness(1.15); opacity: 0.7; }
.lockCount {
  position: absolute; right: -16%; top: -10%; min-width: 46%; height: 46%; padding: 0 8%; border-radius: 999px;
  background: #ff5cc6; border: 2px solid var(--white); color: var(--white); font: 700 11px/1 var(--display);
  display: flex; align-items: center; justify-content: center;
}
.part { position: absolute; left: 0; top: 0; border-radius: 50%; }

/* the news banner (sort/Game.js Banner) */
.banner { position: absolute; left: 0; right: 0; top: 2%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 30; }
.bannerText { font: 700 40px/1 var(--display); color: var(--white); text-shadow: 0 3px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); text-align: center; }
.bannerSub { margin-top: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(69,16,122,0.8); font: 700 13px/1.3 var(--display); color: var(--white); text-align: center; }

/* the goal and the stars, in the Crib's brown glass */
.strip { position: relative; z-index: 20; display: flex; align-items: stretch; gap: 10px; margin: 4px 0 6px; padding: 6px; border-radius: 20px; background: var(--glass); border: 2px solid rgba(255,255,255,0.9); }
.goalCard { width: 112px; flex: none; background: rgba(255,255,255,0.95); border-radius: 15px; border: 3px solid var(--white); padding: 2px 5px 5px; display: flex; flex-direction: column; align-items: center; }
.goalLabel { font: 700 10.5px/1.3 var(--display); letter-spacing: 1.2px; color: #6b3fa0; }
.goalRow { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
.goalArrow { font: 700 13px/1 var(--display); color: #b9a6cc; }
.miniGoal { position: relative; width: 36px; height: 36px; flex: none; }
.miniGoal > svg:first-child { position: absolute; inset: 0; }
.miniGoal .mstar { position: absolute; left: 50%; top: 46%; width: 20px; height: 20px; transform: translate(-50%, -50%); transition: filter 300ms, opacity 300ms; }
.miniGoal.locked .mstar { filter: grayscale(1) brightness(1.15); opacity: 0.6; }
.stripRight { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.meterRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meter { display: flex; align-items: flex-start; gap: 1px; }
.meter svg { display: block; }
.pill { padding: 1px 9px; border-radius: 999px; background: var(--white); border: 2.5px solid var(--gold); font: 700 12.5px/1.3 var(--display); color: var(--gold-ink); letter-spacing: 0.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.hops { border-color: #ffe6b8; color: var(--brown); }
.tip { font: 800 12px/15px var(--body); color: var(--white); min-height: 30px; }
.tip.warn { color: #ffd0d6; }

/* Head: a creature in a white sticker circle (squishdoku/ui.js) */
.headSticker { position: relative; border-radius: 50%; background: var(--white); padding: 6%; flex: none; }
.headSticker > div { width: 100%; height: 100%; border-radius: 50%; background: #f6efff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.headSticker img { width: 92%; height: 92%; object-fit: contain; display: block; }
.headSticker.dim { background: rgba(255,255,255,0.55); }
.headSticker.dim img { opacity: 0.25; }
.headSticker.dim > div { background: rgba(255,255,255,0.35); }

/* ---- pill buttons (SdButton's shape; the Crib's faces and brown ring under the board) */
.sd { position: relative; display: inline-block; vertical-align: top; padding: 0 0 5px; border: 0; background: none; cursor: pointer; transition: transform 70ms; }
.sd .lip { display: block; position: absolute; left: 0; right: 0; top: 5px; bottom: 0; border-radius: 999px; background: var(--r); }
.sd .rg { display: block; position: relative; padding: 2.5px; border-radius: 999px; background: var(--r); transition: transform 70ms; }
.sd .face {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px;
  border: 3px solid var(--white); border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, var(--c0) 0%, var(--c1) var(--mid, 50%), var(--c2) 100%);
}
.sd .face::before { content: ''; position: absolute; left: 8%; right: 8%; top: 2px; height: 42%; border-radius: 999px; background: rgba(255,255,255,0.45); pointer-events: none; }
.sd .lbl { position: relative; font: 700 var(--fs, 17px)/1.15 var(--display); color: var(--white); white-space: nowrap; text-shadow: 0 2px 0 var(--lr), 1px 0 0 var(--lr), -1px 0 0 var(--lr); }
.sd:active:not(:disabled), .sd.down:not(:disabled) { transform: scale(0.93); }
.sd:active:not(:disabled) .rg, .sd.down:not(:disabled) .rg { transform: translateY(4px); }
.sd:disabled { cursor: default; --c0: #e6dcf0; --c1: #c9b9da; --c2: #b9a6cc; }
.sd:disabled .lbl { opacity: 0.85; }
.k-pink { --r: #8e1580; --c0: #ffd6f4; --c1: #ff5cc6; --c2: #c02bd9; --lr: #8e1580; }
.k-gold { --r: #9c4d06; --c0: #fff7b0; --c1: #ffd23a; --c2: #ff9c0a; --lr: #9c4d06; }
.k-green { --r: #0d7a4a; --c0: #b8ffd9; --c1: #3ddc97; --c2: #16a86a; --lr: #0d7a4a; }
.k-purple { --r: #45189a; --c0: #efe6ff; --c1: #b48bff; --c2: #8f3cf2; --lr: #45189a; }
.k-white { --r: #45189a; --c0: #ffffff; --c1: #f6efff; --c2: #e4d6ff; --lr: #45189a; }
/* crib/Hud.js FACES on the Crib's brown ring */
.k-cblue { --r: #5b3a29; --c0: #d6ecff; --c1: #8fc4f0; --c2: #5a92c8; --lr: #2f5f8f; --mid: 55%; }
.k-cpurple { --r: #5b3a29; --c0: #e9d6ff; --c1: #b38cff; --c2: #8a5fd6; --lr: #6a3a8a; --mid: 55%; }
.k-cgold { --r: #5b3a29; --c0: #fff2c2; --c1: #ffd36a; --c2: #e8a63a; --lr: #9c5a12; --mid: 55%; }

.controls { position: relative; z-index: 20; display: flex; justify-content: center; gap: 8px; }
.controls .sd { flex: 1; max-width: 130px; }
.controls .face { padding: 10px 6px; }

/* ---- cards (squishdoku/Overlays.js Overlay) */
#overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
#overlay .tint { position: absolute; inset: 0; background: var(--tint, rgba(40,8,80,0.55)); animation: fadeIn 220ms ease-out both; }
#overlay .card { position: relative; width: 100%; max-width: 380px; max-height: 100%; border-radius: 30px; background: var(--ring); padding: 3px 3px 8px; animation: cardIn 420ms cubic-bezier(0.3, 1.5, 0.55, 1) both; }
#overlay .cardRim { border-radius: 27px; background: var(--white); padding: 3px; }
#overlay .cardFill {
  border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: linear-gradient(180deg, #fff6fd 0%, #ffe3f6 55%, #efd8ff 100%); overflow-y: auto; max-height: calc(100vh - 60px);
}
#overlay.out .tint { animation: fadeOut 180ms ease-in both; }
#overlay.out .card { animation: cardOut 180ms ease-in both; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(120px) scale(0.7); } 30% { opacity: 1; } }
@keyframes cardOut { to { opacity: 0; transform: translateY(120px) scale(0.7); } }
.ot { display: block; overflow: visible; }
.sub { font: 700 12px/1.35 var(--display); letter-spacing: 0.6px; color: var(--sub); text-align: center; }
.hintLine { font: 800 11.5px/1.35 var(--body); color: var(--gold-ink); text-align: center; }
.body { font: 800 14px/1.35 var(--body); color: var(--ink); text-align: center; padding: 0 6px; }
.btnRow { display: flex; align-items: flex-start; justify-content: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.btnRow .face { padding: 10px 12px; }
.btnRow .big .face { padding: 12px 18px; }
.col { align-self: stretch; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.col .sd { width: 100%; }
.col .face { padding: 12px; }
.stars { display: flex; align-items: center; justify-content: center; margin: 4px 0 8px; }
.starSlot { position: relative; display: flex; align-items: center; justify-content: center; }
.starSlot .rays {
  position: absolute; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(rgba(255,228,92,0.6) 0deg 8deg, transparent 8deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%);
  animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.rules { align-self: stretch; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.rule { display: flex; align-items: center; gap: 10px; }
.ruleNum { width: 30px; height: 30px; flex: none; border-radius: 50%; background: #ff5cc6; border: 2.5px solid var(--white); display: flex; align-items: center; justify-content: center; font: 700 15px/1 var(--display); color: var(--white); }
.ruleTitle { font: 700 15px/1.2 var(--display); color: var(--pink-ink); }
.ruleLine { font: 800 12px/16px var(--body); color: var(--ink); }
.twistHead { margin-top: 6px; font: 700 12px/1.2 var(--display); letter-spacing: 1px; color: var(--sub); align-self: flex-start; }
.twist { align-self: stretch; font: 800 11.5px/15.5px var(--body); color: var(--ink); }
.twistName { font-family: var(--display); font-weight: 700; color: #e01e4a; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 4px; align-self: stretch; margin-top: 4px; }
.lvTile { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.lvTile .face { padding: 6px 0; width: 46px; }
.lvStars { display: flex; gap: 1px; }
.lvRoom { font: 700 9.5px/1.2 var(--display); letter-spacing: 0.3px; color: var(--sub); }
.rock { animation: rock 1.8s ease-in-out infinite; }
@keyframes rock { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

/* the twists: arrows on cushions, bubbles over them, numbered friends,
   beat tiles on the dance floor */
.tile .mark { pointer-events: none; }
.tile .mark svg { display: block; }
.bubble { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; pointer-events: none; }
.bubble .bob { position: absolute; inset: 0; animation: bob 2.2s ease-in-out infinite; }
.bubble .ball {
  position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid #ffffff;
  background: radial-gradient(circle at 34% 30%, #ffffff 0 12%, rgba(255,255,255,0.6) 15%, rgba(150,214,255,0.55) 42%, rgba(200,170,255,0.6) 72%, rgba(255,170,225,0.75) 100%);
  box-shadow: 0 0 0 1.5px rgba(60,120,190,0.55), 0 3px 8px rgba(40,60,140,0.3), inset -4px -5px 9px rgba(120,90,230,0.35);
}
.ordChip, .slotNum {
  position: absolute; z-index: 2; border-radius: 999px; background: #ff5cc6; border: 2px solid var(--white); color: var(--white);
  font: 700 11px/1 var(--display); display: flex; align-items: center; justify-content: center;
}
.ordChip { right: -8%; top: -6%; min-width: 22px; height: 22px; padding: 0 4px; }
.slotNum { right: -5px; top: -5px; min-width: 14px; height: 14px; font-size: 8.5px; border-width: 1.5px; }
.dt.beat:not(.lit) { background: color-mix(in srgb, var(--tc) 32%, #140818); box-shadow: inset 0 0 0 3px var(--tc); }
.dt.beat:not(.lit)::after { opacity: 0.15; }
.dt.beat.lit { animation: beatPulse 0.45s ease-in-out infinite alternate; }
@keyframes beatPulse { from { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5), 0 0 8px var(--tc); } to { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.9), 0 0 22px var(--tc); } }
.beatPill { display: flex; align-items: center; gap: 4px; border-color: #ff5c8a; color: #8e1580; }
.beatPill .bd { width: 9px; height: 9px; border-radius: 3px; opacity: 0.5; }
.beatPill .bd.now { width: 13px; height: 13px; opacity: 1; box-shadow: 0 0 0 2px var(--white), 0 0 0 3.5px #140818; }
.chHead { grid-column: 1 / -1; margin-top: 6px; font: 700 12px/1.2 var(--display); letter-spacing: 1px; color: var(--pink-ink); text-align: left; }
#overlay .card.tall .cardFill { max-height: calc(100vh - 70px); }
#levelList { max-height: 52vh; overflow-y: auto; padding: 2px 4px 6px; }

@media (prefers-reduced-motion: reduce) {
  .breathe, .friend .breathe, .rock, .starSlot .rays, .goalStar .bob, .dt.hue, .bubble .bob, .dt.beat.lit { animation: none; }
}
</style>
</head>
<body>
<div id="scene"><div id="room"></div><div id="tint"></div></div>

<div id="app">
  <header class="top">
    <button class="cribBtn" id="back" aria-label="Pause"><span class="cc cc1"></span><span class="cc cc0"></span><span class="cface"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" transform="translate(0 1.5)" stroke="#8a1f6a" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 4 L7 12 L15 20" stroke="#ffffff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    <div class="titleBox">
      <div id="roomTitle"></div>
      <div class="roomSub"><span id="levelText">SQUISH HOP · LEVEL 1</span><span class="chip" id="tier">EASY</span></div>
    </div>
    <div class="phase" id="phase"><span class="sun" id="sun"></span><span id="phaseText">DAYTIME</span></div>
  </header>

  <main class="area" id="area">
    <div class="plane" id="plane"></div>
    <div class="layer" id="layer"></div>
    <div class="banner" id="banner" hidden></div>
  </main>

  <section class="strip">
    <div class="goalCard" id="goalCard">
      <div class="goalLabel">GOAL</div>

(function () {
