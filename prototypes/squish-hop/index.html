<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squish Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Squish Hop: one phone-width column on the app's sky stage: the top bar,
   the goal card and star meter, the cushion quilt, then UNDO / RESTART /
   HINT. Every value is the app's own (src/theme/candyTheme.js,
   src/components/candy/*, src/squishdoku/{theme,ui,Board,Hud}.js,
   src/stack/{Game,Cards,Pieces}.js). One look, like the app: no dark mode. */
:root {
  --ink: #45107a;          /* the app's deep plum (squishdoku/theme INK) */
  --ring: #45189a;         /* rings, frames, card rims */
  --outline: #6a1b9a;      /* title halo */
  --outline-deep: #45107a; /* title drop */
  --pink-ink: #8e1580;     /* game name, rule titles */
  --sub: #8a5fc0;          /* card sub-lines */
  --gold-ink: #b86200;
  --gold: #ffd23a;
  --coin-text: #ffe045;
  --seam: #e9dcf7;         /* the quilt's seams */
  --glass: rgba(80, 12, 140, 0.42);
  --white: #ffffff;
  --sky-0: #8fd0ff; --sky-1: #b9e2ff; --sky-2: #e6dcff; --sky-3: #ffd6f4;
  --display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--sky-1); color: var(--ink);
  font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 999px; }

/* ---- the stage: CandyBackground (sky, five cloud wisps, dots every 26px) + Sparkles */
#stage {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.8) 1.3px, transparent 1.6px) 0 0 / 26px 26px,
    radial-gradient(ellipse 90px 26px at 12% 9%, rgba(255,255,255,0.95) 60%, transparent 100%),
    radial-gradient(ellipse 60px 20px at 24% 7%, rgba(255,255,255,0.95) 55%, transparent 100%),
    radial-gradient(ellipse 110px 30px at 88% 15%, rgba(255,255,255,0.9) 55%, transparent 100%),
    radial-gradient(ellipse 130px 34px at 8% 52%, rgba(255,255,255,0.7) 50%, transparent 100%),
    radial-gradient(ellipse 120px 30px at 96% 70%, rgba(255,255,255,0.7) 50%, transparent 100%),
    linear-gradient(180deg, var(--sky-0) 0%, var(--sky-1) 38%, var(--sky-2) 68%, var(--sky-3) 100%);
}
#sparkles { position: absolute; inset: 0; opacity: 0.7; }
.twinkle {
  position: absolute; line-height: 1.1; text-shadow: 0 0 8px rgba(255,200,245,0.95);
  animation: twinkle var(--d) ease-in-out var(--dl) infinite alternate;
}
@keyframes twinkle { from { opacity: 0.2; transform: scale(0.6) rotate(0deg); } to { opacity: 1; transform: scale(1.1) rotate(20deg); } }

/* ---- the column */
#app {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 6px;
}

/* the top bar (stack/Game.js hud) */
.hud { display: flex; align-items: center; gap: 10px; }
.titleBox { flex: 1; min-width: 0; }
.gameName { font: 700 13px/1.2 var(--display); letter-spacing: 1px; color: var(--pink-ink); }
.row6 { display: flex; align-items: center; gap: 6px; }
.levelText { font: 700 21px/1.15 var(--display); color: var(--white); text-shadow: 0 2.5px 1px var(--ink); }
.chip { padding: 1px 7px; border-radius: 999px; border: 2px solid var(--white); font: 700 10px/1.3 var(--display); letter-spacing: 0.6px; color: var(--white); }
.movesPill { min-width: 64px; padding: 3px 10px; border-radius: 16px; background: var(--glass); border: 2.5px solid var(--white); text-align: center; }
.movesLabel { font: 700 10px/1.2 var(--display); letter-spacing: 1px; color: var(--white); }
.movesNum { font: 700 22px/1 var(--display); color: var(--coin-text); font-variant-numeric: tabular-nums; }

/* RoundButton, violet */
.round { position: relative; width: 40px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.round .rlip { display: block; position: absolute; left: 0; top: 4px; width: 40px; height: 40px; border-radius: 50%; background: var(--ring); }
.round .rface {
  display: block; position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ring);
  background: var(--ring); transition: transform 80ms;
}
.round .rin {
  position: absolute; inset: 0; border-radius: 50%; border: 2.5px solid var(--white); overflow: hidden;
  background: radial-gradient(circle at 35% 25%, #f3d2ff 0%, #b65cff 36%, #6a22d6 80%);
  display: flex; align-items: center; justify-content: center;
}
.round .rin::before { content: ''; position: absolute; left: 9%; right: 9%; top: 0; height: 44%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.1)); }
.round .glyph { position: relative; font: 900 24px/26px var(--body); margin-top: -3px; color: var(--white); text-shadow: 0 2px 1px var(--ring); }
.round:active .rface, .round.down .rface { transform: translateY(3px); }

/* the goal card and the meter (stack/Game.js info, Pieces.js GoalCard) */
.info { display: flex; align-items: stretch; gap: 10px; margin-top: 8px; min-height: 72px; }
.goalCard {
  width: 118px; flex: none; background: rgba(255,255,255,0.95); border-radius: 16px; border: 3px solid var(--white);
  padding: 2px 5px 6px; display: flex; flex-direction: column; align-items: center;
}
.goalLabel { font: 700 10.5px/1.3 var(--display); letter-spacing: 1.2px; color: #6b3fa0; }
.goalRow { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
.goalArrow { font: 700 13px/1 var(--display); color: #b9a6cc; }
.miniGoal { position: relative; width: 38px; height: 38px; }
.miniGoal img { width: 100%; height: 100%; display: block; }
.miniGoal svg { position: absolute; left: 50%; top: 47%; width: 20px; height: 20px; transform: translate(-50%, -50%); }
.infoRight { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.meterRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meter { display: flex; align-items: flex-start; gap: 1px; }
.meter svg { display: block; }
.parPill { padding: 2px 10px; border-radius: 999px; background: var(--white); border: 2.5px solid var(--gold); font: 700 13px/1.3 var(--display); color: var(--gold-ink); letter-spacing: 0.6px; font-variant-numeric: tabular-nums; }
.tip { font: 800 12.5px/16px var(--body); color: var(--ink); min-height: 32px; }
.tip.warn { color: #e01e4a; }

/* Head: a creature in a white sticker circle (squishdoku/ui.js) */
.headSticker { position: relative; border-radius: 50%; background: var(--white); padding: 6%; flex: none; }
.headSticker > div { width: 100%; height: 100%; border-radius: 50%; background: #f6efff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.headSticker img { width: 92%; height: 92%; object-fit: contain; display: block; }
.headSticker.dim img { opacity: 0.25; }
.headSticker.dim { background: rgba(255,255,255,0.55); }
.headSticker.dim > div { background: rgba(255,255,255,0.35); }

/* ---- the board (squishdoku/Board.js frame: ring, white rim, lilac seams) */
.area { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-touch-callout: none; }
.area img { pointer-events: none; -webkit-user-drag: none; }
.board { position: relative; }
.bLip { position: absolute; left: 0; top: 5px; right: 0; bottom: 0; border-radius: 20px; background: var(--ring); }
.bFrame { position: relative; border-radius: 20px; background: var(--ring); padding: 2.5px; }
.bRim { border-radius: 17.5px; background: var(--white); padding: 3.5px; }
.bGrid { position: relative; border-radius: 13px; overflow: hidden; background: var(--seam); }
.layer { position: absolute; left: 6px; top: 6px; pointer-events: none; }
.cell { position: absolute; }
.cell img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.cell img.base2 { filter: brightness(0.84) saturate(1.05); }
.cell img.top2 { transform: translateY(-7%) scale(0.86); }
.dent { position: absolute; left: 6%; top: 6%; right: 6%; bottom: 9%; border-radius: 26%; border: 2px dashed rgba(69,16,122,0.2); background: rgba(69,16,122,0.05); }
.badge { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); transition: filter 300ms, opacity 300ms; }
.badge.locked { filter: grayscale(1) brightness(1.15); opacity: 0.6; }
.lockCount {
  position: absolute; right: 9%; top: 6%; min-width: 22%; height: 22%; padding: 0 4%; border-radius: 999px;
  background: #ff5cc6; border: 2px solid var(--white); color: var(--white); font: 700 11px/1 var(--display);
  display: flex; align-items: center; justify-content: center;
}
.piece { position: absolute; left: 0; top: 0; }
.piece .shadow { position: absolute; left: 50%; bottom: 2%; width: 62%; height: 14%; margin-left: -31%; border-radius: 50%; background: rgba(69,16,122,0.28); }
.piece .lift, .piece .squash { position: absolute; inset: 0; }
.piece .squash { transform-origin: 50% 92%; }
.piece img { width: 100%; height: 100%; display: block; object-fit: contain; }
.breathe { animation: breathe 2.6s ease-in-out infinite; transform-origin: 50% 92%; position: absolute; inset: 0; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 0.97); } }
.friend .breathe { animation: breathe 2.2s ease-in-out infinite, peek 6s ease-in-out infinite; animation-delay: var(--fd), var(--fd); }
@keyframes peek { 0%, 84%, 100% { rotate: 0deg; } 88% { rotate: -9deg; } 92% { rotate: 8deg; } 96% { rotate: -3deg; } }
.tear { position: absolute; width: 12%; height: 12%; background: #8fdcff; border: 1px solid var(--white); border-radius: 50% 0 50% 50%; transform: rotate(-45deg); opacity: 0; }
.hintGlow {
  position: absolute; border-radius: 26%; border: 3px solid var(--gold);
  box-shadow: 0 0 14px 2px rgba(255,226,92,0.9), inset 0 0 12px rgba(255,226,92,0.8); animation: hintPulse 0.5s ease-in-out 6 alternate;
}
@keyframes hintPulse { from { transform: scale(0.94); opacity: 0.55; } to { transform: scale(1.04); opacity: 1; } }
.part { position: absolute; left: 0; top: 0; border-radius: 50%; }

/* the news banner (sort/Game.js Banner) */
.banner { position: absolute; left: 0; right: 0; top: 4%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
.bannerText { font: 700 40px/1 var(--display); color: var(--white); text-shadow: 0 3px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); text-align: center; }
.bannerSub { margin-top: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(69,16,122,0.8); font: 700 13px/1.3 var(--display); color: var(--white); text-align: center; }

/* ---- SdButton (squishdoku/ui.js): ring + lip, white border, gradient face, top shine */
.sd { position: relative; display: inline-block; vertical-align: top; padding: 0 0 5px; border: 0; background: none; cursor: pointer; transition: transform 70ms; }
.sd .lip { display: block; position: absolute; left: 0; right: 0; top: 5px; bottom: 0; border-radius: 999px; background: var(--r); }
.sd .rg { display: block; position: relative; padding: 2.5px; border-radius: 999px; background: var(--r); transition: transform 70ms; }
.sd .face {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px;
  border: 3px solid var(--white); border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, var(--c0) 0%, var(--c1) 50%, var(--c2) 100%);
}
.sd .face::before { content: ''; position: absolute; left: 8%; right: 8%; top: 2px; height: 42%; border-radius: 999px; background: rgba(255,255,255,0.45); pointer-events: none; }
.sd .lbl { position: relative; font: 700 var(--fs, 17px)/1.15 var(--display); color: var(--white); white-space: nowrap; text-shadow: 0 2px 0 var(--lr), 1px 0 0 var(--lr), -1px 0 0 var(--lr); }
.sd:active:not(:disabled), .sd.down:not(:disabled) { transform: scale(0.93); }
.sd:active:not(:disabled) .rg, .sd.down:not(:disabled) .rg { transform: translateY(4px); }
.sd:disabled { cursor: default; --r: #7a6a8c; --c0: #e6dcf0; --c1: #c9b9da; --c2: #b9a6cc; }
.k-pink { --r: #8e1580; --c0: #ffd6f4; --c1: #ff5cc6; --c2: #c02bd9; --lr: #8e1580; }
.k-gold { --r: #9c4d06; --c0: #fff7b0; --c1: #ffd23a; --c2: #ff9c0a; --lr: #9c4d06; }
.k-green { --r: #0d7a4a; --c0: #b8ffd9; --c1: #3ddc97; --c2: #16a86a; --lr: #0d7a4a; }
.k-purple { --r: #45189a; --c0: #efe6ff; --c1: #b48bff; --c2: #8f3cf2; --lr: #45189a; }
.k-white { --r: #45189a; --c0: #ffffff; --c1: #f6efff; --c2: #e4d6ff; --lr: #45189a; }

.controls { display: flex; justify-content: center; gap: 8px; padding-top: 4px; }
.controls .sd { flex: 1; max-width: 130px; }
.controls .face { padding: 10px 6px; }

/* ---- cards (squishdoku/Overlays.js Overlay) */
#overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
#overlay .tint { position: absolute; inset: 0; background: var(--tint, rgba(40,8,80,0.55)); animation: fadeIn 220ms ease-out both; }
#overlay .card { position: relative; width: 100%; max-width: 380px; max-height: 100%; border-radius: 30px; background: var(--ring); padding: 3px 3px 8px; animation: cardIn 420ms cubic-bezier(0.3, 1.5, 0.55, 1) both; }
#overlay .cardRim { border-radius: 27px; background: var(--white); padding: 3px; }
#overlay .cardFill {
  border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: linear-gradient(180deg, #fff6fd 0%, #ffe3f6 55%, #efd8ff 100%); overflow-y: auto; max-height: calc(100vh - 60px);
}
#overlay.out .tint { animation: fadeOut 180ms ease-in both; }
#overlay.out .card { animation: cardOut 180ms ease-in both; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(120px) scale(0.7); } 30% { opacity: 1; } }
@keyframes cardOut { to { opacity: 0; transform: translateY(120px) scale(0.7); } }
.ot { display: block; overflow: visible; }
.sub { font: 700 12px/1.35 var(--display); letter-spacing: 0.6px; color: var(--sub); text-align: center; }
.hintLine { font: 800 11.5px/1.35 var(--body); color: var(--gold-ink); text-align: center; }
.body { font: 800 14px/1.35 var(--body); color: var(--ink); text-align: center; padding: 0 6px; }
.btnRow { display: flex; align-items: flex-start; justify-content: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.btnRow .face { padding: 10px 12px; }
.btnRow .big .face { padding: 12px 18px; }
.col { align-self: stretch; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.col .sd { width: 100%; }
.col .face { padding: 12px; }
.stars { display: flex; align-items: center; justify-content: center; margin: 4px 0 8px; }
.starSlot { position: relative; display: flex; align-items: center; justify-content: center; }
.starSlot .rays {
  position: absolute; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(rgba(255,228,92,0.6) 0deg 8deg, transparent 8deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 15%, transparent 65%); mask: radial-gradient(circle, #000 15%, transparent 65%);
  animation: spin 14s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.rules { align-self: stretch; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.rule { display: flex; align-items: center; gap: 10px; }
.ruleNum { width: 30px; height: 30px; flex: none; border-radius: 50%; background: #ff5cc6; border: 2.5px solid var(--white); display: flex; align-items: center; justify-content: center; font: 700 15px/1 var(--display); color: var(--white); }
.ruleTitle { font: 700 15px/1.2 var(--display); color: var(--pink-ink); }
.ruleLine { font: 800 12px/16px var(--body); color: var(--ink); }
.twistHead { margin-top: 6px; font: 700 12px/1.2 var(--display); letter-spacing: 1px; color: var(--sub); align-self: flex-start; }
.twist { align-self: stretch; font: 800 11.5px/15.5px var(--body); color: var(--ink); }
.twistName { font-family: var(--display); font-weight: 700; color: #e01e4a; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; align-self: stretch; margin-top: 4px; }
.lvTile { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.lvTile .face { padding: 8px 0; width: 58px; }
.lvStars { display: flex; gap: 1px; }
.rock { animation: rock 1.8s ease-in-out infinite; }
@keyframes rock { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

@media (prefers-reduced-motion: reduce) {
  .twinkle, .breathe, .friend .breathe, .rock, .starSlot .rays { animation: none; }
}
</style>
</head>
<body>
<div id="stage"><div id="sparkles"></div></div>

<div id="app">
  <header class="hud">
    <button class="round" id="back" aria-label="Pause"><span class="rlip"></span><span class="rface"><span class="rin"><span class="glyph">‹</span></span></span></button>
    <div class="titleBox">
      <div class="gameName">SQUISH HOP</div>
      <div class="row6"><span class="levelText" id="levelText">LEVEL 1</span><span class="chip" id="tier">EASY</span></div>
    </div>
    <div class="movesPill"><div class="movesLabel">HOPS</div><div class="movesNum" id="hops">0</div></div>
  </header>

  <section class="info">
    <div class="goalCard" id="goalCard">
      <div class="goalLabel">GOAL</div>
      <div class="goalRow" id="goalRow"></div>
    </div>
    <div class="infoRight">
      <div class="meterRow"><div class="meter" id="meter"></div><div class="parPill" id="leftPill">LEFT 0</div></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <main class="area" id="area">
    <div class="board" id="board">
      <div class="bLip"></div>
      <div class="bFrame"><div class="bRim"><div class="bGrid" id="grid"></div></div></div>
      <div class="layer" id="layer"></div>
    </div>
    <div class="banner" id="banner" hidden></div>
  </main>

  <footer class="controls">
    <button class="sd k-white" id="undo"><span class="lip"></span><span class="rg"><span class="face"><span class="lbl" style="--fs:15px;--lr:#45189a">UNDO</span></span></span></button>
    <button class="sd k-purple" id="restart"><span class="lip"></span><span class="rg"><span class="face"><span class="lbl" style="--fs:15px">RESTART</span></span></span></button>
    <button class="sd k-gold" id="hint"><span class="lip"></span><span class="rg"><span class="face"><span class="lbl" style="--fs:15px">HINT</span></span></span></button>
  </footer>
</div>

<div id="overlay" hidden></div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(function () {
  'use strict';
  const E = window.HopEngine;
  const LEVELS = window.HopLevels;

  // ---- the repository's own assets (heads: tools/rig/heads.mjs; cushions:
  // tools/squishdoku/cushions.mjs; sounds: tools/audio/*). Literal paths, so
  // tools/bundle.mjs can inline them.
  const A = {
    cush: {
      violet: '../../assets/squishdoku/cushions/violet.webp',
      magenta: '../../assets/squishdoku/cushions/magenta.webp',
      gold: '../../assets/squishdoku/cushions/gold.webp',
    },
    heads: {
      bubbly: { idle: '../../assets/squishdoku/heads/bubbly-idle.webp', happy: '../../assets/squishdoku/heads/bubbly-happy.webp', sad: '../../assets/squishdoku/heads/bubbly-sad.webp' },
      boba: { idle: '../../assets/squishdoku/heads/boba-idle.webp', happy: '../../assets/squishdoku/heads/boba-happy.webp' },
      mochi: { idle: '../../assets/squishdoku/heads/mochi-idle.webp', happy: '../../assets/squishdoku/heads/mochi-happy.webp' },
      berri: { idle: '../../assets/squishdoku/heads/berri-idle.webp', happy: '../../assets/squishdoku/heads/berri-happy.webp' },
      dunkie: { idle: '../../assets/squishdoku/heads/dunkie-idle.webp', happy: '../../assets/squishdoku/heads/dunkie-happy.webp' },
      pip: { idle: '../../assets/squishdoku/heads/pip-idle.webp', happy: '../../assets/squishdoku/heads/pip-happy.webp' },
    },
    snd: {
      tap: '../../assets/audio/sfx/tap.wav',
      select: '../../assets/audio/squishdoku/sd_select.wav',
      hop: '../../assets/audio/stack/st_lift.wav',
      pop: '../../assets/audio/pop.mp3',
      bonk: '../../assets/audio/sfx/bonk.wav',
      undo: '../../assets/audio/stack/st_undo.wav',
      hint: '../../assets/audio/stack/st_hint.wav',
      squeak: '../../assets/audio/squishdoku/sd_squeak.wav',
      unlock: '../../assets/audio/squishdoku/sd_unlock.wav',
      wrong: '../../assets/audio/squishdoku/sd_wrong.wav',
      land: '../../assets/audio/stack/st_land.wav',
      solve: '../../assets/audio/squishdoku/sd_solve.ogg',
      star1: '../../assets/audio/squishdoku/sd_star1.wav',
      star2: '../../assets/audio/squishdoku/sd_star2.ogg',
      star3: '../../assets/audio/squishdoku/sd_star3.ogg',
      starEmpty: '../../assets/audio/squishdoku/sd_starEmpty.wav',
      perfect: '../../assets/audio/squishdoku/sd_perfect.ogg',
      boardIn: '../../assets/audio/squishdoku/sd_boardIn.wav',
      news: '../../assets/audio/stack/st_news.wav',
    },
  };
  const PLAYER = 'bubbly';
  // where Bubbly's eyes are on its head picture (src/squishdoku/heads.js EYES)
  const PLAYER_EYES = [[0.436, 0.536], [0.666, 0.536]];
  const FRIENDS = ['boba', 'mochi', 'berri', 'dunkie', 'pip'];
  const TIER_NAMES = ['EASY', 'MEDIUM', 'HARD', 'EXPERT'];
  const TIER_COLORS = ['#3ddc97', '#5fb8ff', '#ff8a4a', '#e01e4a'];
  const STAR_D = 'M12 2.2 L14.9 8.6 L21.8 9.3 L16.6 14 L18.1 20.9 L12 17.4 L5.9 20.9 L7.4 14 L2.2 9.3 L9.1 8.6 Z';
  const TITLES = ['', 'HOPPED!', 'NICE HOPPING!', 'ALL CLEAR!'];
  const NEWS = {
    friends: { text: 'FRIENDS!', sub: 'The ★ opens when everyone is with you.' },
    doubles: { text: 'DOUBLES!', sub: 'Pink cushions take two hops to clear.' },
  };
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = (t) => (RM ? Math.round(t * 0.4) : t);
  const $ = (id) => document.getElementById(id);
  const wait = (t) => new Promise((r) => setTimeout(r, t));

  // ---- saved progress (this browser only)
  const SAVE_KEY = 'squishHop.v1';
  let save = { best: {}, seenHow: false, seenNews: {}, muted: false };
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) save = Object.assign(save, JSON.parse(raw));
  } catch (e) { /* no storage: play without saving */ }
  function store() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ }
  }

  // ---- sounds: a few <audio> players per sound, so quick repeats overlap
  const Sound = (() => {
    const pools = {};
    function play(name, vol = 0.75) {
      if (save.muted) return;
      const src = A.snd[name];
      if (!src) return;
      const pool = pools[name] || (pools[name] = []);
      let a = pool.find((x) => x.paused || x.ended);
      if (!a) {
        if (pool.length >= 4) a = pool[0];
        else { a = new Audio(src); pool.push(a); }
      }
      try {
        a.currentTime = 0;
        a.volume = vol;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* ignore */ }
    }
    return { play };
  })();

  // ---- small drawing helpers
  function starSvg(size, lit, kind) {
    if (kind === 'meter') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR_D}" fill="${lit ? '#ffd23a' : 'rgba(255,255,255,0.55)'}" stroke="${lit ? '#b86200' : '#b9a6cc'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
    }
    if (kind === 'badge') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR_D}" fill="#b86200" transform="translate(0 1.4)" stroke-linejoin="round"/><path d="${STAR_D}" fill="#ffd23a" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
    }
    // the result card's star (sort/Cards.js Star)
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${STAR_D}" fill="${lit ? '#b86200' : 'rgba(69,16,122,0.25)'}" transform="translate(0 1.2)" stroke-linejoin="round"/><path d="${STAR_D}" fill="${lit ? '#ffd23a' : 'rgba(255,255,255,0.7)'}" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>${lit ? '<path d="M8 9.6 L10.4 9.2 L11.3 7" stroke="#fff6c4" stroke-width="1.4" stroke-linecap="round" fill="none"/>' : ''}</svg>`;
  }

  // OutlinedTitle (components/candy/OutlinedTitle.js): gradient letters, a
  // white outline, a purple halo and a deep drop, drawn as stacked SVG text
  const FILLS = { gold: [['0', '#fffbd6'], ['0.45', '#ffe045'], ['1', '#ff9500']], pink: [['0', '#ffd6f4'], ['0.52', '#ff5cc6'], ['1', '#c02bd9']] };
  const measureCtx = document.createElement('canvas').getContext('2d');
  let titleN = 0;
  function titleSvg(text, fill = 'pink', size = 30) {
    const outline = 3;
    const halo = outline + 2;
    const drop = size >= 26 ? 5 : size >= 18 ? 4 : 3;
    measureCtx.font = `700 ${size}px Fredoka, 'Baloo 2', 'Trebuchet MS', sans-serif`;
    const textW = measureCtx.measureText(text).width + text.length * 1;
    const w = Math.ceil(textW + halo * 2 + 2 + size * 0.12);
    const h = Math.ceil(size * 1.22 + halo * 2 + drop);
    const base = halo + size * 0.96;
    const id = `tf${++titleN}`;
    const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const common = `x="${w / 2}" text-anchor="middle" font-family="Fredoka, 'Baloo 2', 'Trebuchet MS', sans-serif" font-weight="700" font-size="${size}" letter-spacing="1" stroke-linejoin="round"`;
    return `<svg class="ot" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc}">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${FILLS[fill].map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient></defs>
      <text ${common} y="${base + drop}" fill="#45107a" stroke="#45107a" stroke-width="${halo * 2}">${esc}</text>
      <text ${common} y="${base}" fill="#6a1b9a" stroke="#6a1b9a" stroke-width="${halo * 2}">${esc}</text>
      <text ${common} y="${base}" fill="#ffffff" stroke="#ffffff" stroke-width="${outline * 2}">${esc}</text>
      <text ${common} y="${base}" fill="url(#${id})">${esc}</text></svg>`;
  }

  function button(kind, label, { id = '', fs = 17, lr, cls = '' } = {}) {
    const lrStyle = lr ? `;--lr:${lr}` : '';
    return `<button class="sd k-${kind} ${cls}" ${id ? `id="${id}"` : ''}><span class="lip"></span><span class="rg"><span class="face"><span class="lbl" style="--fs:${fs}px${lrStyle}">${label}</span></span></span></button>`;
  }

  function headSticker(key, face, size, dim) {
    return `<div class="headSticker${dim ? ' dim' : ''}" style="width:${size}px;height:${size}px"><div><img src="${A.heads[key][face]}" alt=""></div></div>`;
  }

  // ---- background sparkles (components/candy/Sparkles.js SPARKLES table)
  (function sparkles() {
    const COLORS = ['#ffffff', '#fff3a0', '#ffd1f5', '#ffffff'];
    let html = '';
    for (let i = 0; i < 14; i++) {
      const x = ((i * 37 + 11) % 92) + 2;
      const y = ((i * 53 + 7) % 88) + 4;
      const size = 10 + ((i * 7) % 14);
      html += `<span class="twinkle" style="left:${x}%;top:${y}%;font-size:${size}px;color:${COLORS[i % 4]};--d:${1.8 + (i % 5) * 0.5}s;--dl:${((i * 0.37) % 2).toFixed(2)}s">✦</span>`;
    }
    $('sparkles').innerHTML = html;
  })();

  // ---- the game
  const G = {
    idx: 0, def: null, lv: null, st: null, hist: [], hinted: false, asked: false,
    over: false, busy: false, queue: [], feasible: true, plan: null, S: 56,
    cells: {}, player: null, friends: {}, friendKeys: [], slots: [], glow: null,
  };

  function xy(i) { return [i % G.lv.w, (i / G.lv.w) | 0]; }
  function center(i) {
    const [x, y] = xy(i);
    return [x * G.S + G.S / 2, y * G.S + G.S * 0.47];
  }

  // board size from the room the area has
  function measure() {
    const area = $('area');
    const aw = area.clientWidth - 12;
    const ah = area.clientHeight - 12 - 5 - 8;
    G.S = Math.max(28, Math.floor(Math.min(aw / G.lv.w, ah / G.lv.h, 78)));
  }

  function buildBoard() {
    const { lv } = G;
    measure();
    const S = G.S;
    const grid = $('grid');
    const layer = $('layer');
    grid.innerHTML = '';
    layer.innerHTML = '';
    grid.style.width = lv.w * S + 'px';
    grid.style.height = lv.h * S + 'px';
    layer.style.width = lv.w * S + 'px';
    layer.style.height = lv.h * S + 'px';
    G.cells = {};
    for (let i = 0; i < lv.life.length; i++) {
      if (!lv.life[i]) continue;
      const [x, y] = xy(i);
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.cssText = `left:${x * S}px;top:${y * S}px;width:${S}px;height:${S}px`;
      const dent = document.createElement('div');
      dent.className = 'dent';
      const c0 = document.createElement('img');
      c0.alt = '';
      const c1 = document.createElement('img');
      c1.alt = '';
      c1.className = 'top2';
      c1.src = A.cush.magenta;
      el.append(dent, c0, c1);
      const c = { el, dent, c0, c1, life: -1 };
      if (i === lv.goal) {
        c0.src = A.cush.gold;
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.innerHTML = starSvg(Math.round(S * 0.5), true, 'badge');
        const lock = document.createElement('div');
        lock.className = 'lockCount';
        lock.style.fontSize = Math.max(9, Math.round(S * 0.2)) + 'px';
        el.append(badge, lock);
        c.badge = badge;
        c.lock = lock;
        c1.hidden = true;
        dent.hidden = true;
      }
      grid.appendChild(el);
      G.cells[i] = c;
    }
    // friends, then the player on top
    G.friends = {};
    lv.friends.forEach((cell, k) => {
      const key = G.friendKeys[k];
      const p = makePiece(A.heads[key].idle, S * 0.74, 'friend');
      p.key = key;
      p.k = k;
      p.el.style.setProperty('--fd', `${-(k * 0.9).toFixed(1)}s`);
      layer.appendChild(p.el);
      G.friends[cell] = p;
      placePiece(p, cell);
    });
    G.player = makePiece(A.heads[PLAYER].idle, S * 0.88, 'player');
    layer.appendChild(G.player.el);
  }

  function makePiece(src, size, kind) {
    const el = document.createElement('div');
    el.className = `piece ${kind}`;
    el.style.width = el.style.height = size + 'px';
    el.innerHTML = `<div class="shadow"></div><div class="lift"><div class="squash"><div class="breathe"><img alt="" src="${src}"></div></div></div>`;
    return { el, size, lift: el.querySelector('.lift'), squash: el.querySelector('.squash'), img: el.querySelector('img'), shadow: el.querySelector('.shadow'), pos: [0, 0] };
  }
  function placePiece(p, cell) {
    const [cx, cy] = center(cell);
    p.pos = [cx - p.size / 2, cy - p.size / 2];
    p.el.style.transform = `translate(${p.pos[0]}px,${p.pos[1]}px)`;
  }
  function face(f) { G.player.img.src = A.heads[PLAYER][f]; }

  // a cushion cell's look for its hops left: 0 a dent, 1 a cushion, 2 a pink double
  function paint(i) {
    const c = G.cells[i];
    if (i === G.lv.goal) return;
    const life = c.life;
    c.dent.hidden = life > 0;
    c.c0.hidden = life === 0;
    c.c1.hidden = life < 2;
    c.c0.src = life === 2 ? A.cush.magenta : A.cush.violet;
    c.c0.className = life === 2 ? 'base2' : '';
  }

  function ghostOut(c, img) {
    const g = img.cloneNode();
    g.hidden = false;
    c.el.appendChild(g);
    const base = img.className === 'top2' ? 'translateY(-7%) scale(0.86) ' : '';
    g.animate(
      [
        { transform: `${base}scale(1)`, opacity: 1 },
        { transform: `${base}scale(1.16, 0.62)`, opacity: 1, offset: 0.3 },
        { transform: `${base}scale(0.25)`, opacity: 0 },
      ],
      { duration: ms(260), easing: 'ease-out' }
    ).finished.then(() => g.remove());
  }
  function puffIn(img, delay = 0) {
    const base = img.className === 'top2' ? 'translateY(-7%) scale(0.86) ' : '';
    img.animate(
      [
        { transform: `${base}scale(0)`, opacity: 0 },
        { transform: `${base}scale(1.1)`, opacity: 1, offset: 0.6 },
        { transform: `${base}scale(1)`, opacity: 1 },
      ],
      { duration: ms(280), delay, easing: 'ease-out', fill: 'backwards' }
    );
  }

  // move a cell to `life` hops left, animated
  function setCell(i, life, anim = true) {
    const c = G.cells[i];
    if (!c || i === G.lv.goal) return;
    const from = c.life;
    if (from === life) return;
    c.life = life;
    if (!anim || from < 0) { paint(i); return; }
    if (life < from) {
      if (from === 2) ghostOut(c, c.c1);
      if (life === 0) ghostOut(c, c.c0);
      paint(i);
      if (life === 0) {
        const [cx, cy] = center(i);
        burst('pop', cx, cy + G.S * 0.03);
        Sound.play('pop', 0.6);
      } else {
        c.c0.animate([{ transform: 'scale(0.9)' }, { transform: 'scale(1.06)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: ms(260), easing: 'ease-out' });
      }
    } else {
      paint(i);
      if (from === 0) puffIn(c.c0);
      if (life === 2) puffIn(c.c1, from === 0 ? 80 : 0);
    }
  }

  function setGoalLock(anim) {
    const c = G.cells[G.lv.goal];
    const left = G.lv.friends.length - popcount(G.st.got);
    const locked = left > 0;
    const was = c.badge.classList.contains('locked');
    c.badge.classList.toggle('locked', locked);
    c.lock.hidden = !locked;
    c.lock.textContent = left;
    if (anim && was && !locked) {
      c.badge.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.45)', offset: 0.45 }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: ms(520), easing: 'ease-out' });
      const [cx, cy] = center(G.lv.goal);
      burst('spark', cx, cy);
      Sound.play('unlock', 0.6);
    }
    const mini = $('goalRow').querySelector('.miniGoal svg');
    if (mini) mini.style.filter = locked ? 'grayscale(1) brightness(1.15)' : '';
    if (mini) mini.style.opacity = locked ? '0.6' : '1';
  }
  const popcount = (n) => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };

  // ---- particles (squishdoku/fx.js KINDS)
  const KINDS = {
    pop: { count: 10, life: 420, size: [4, 7], dist: [26, 40], up: [0, 0], colors: ['#ff8fd0', '#ffffff', '#ffe066', '#9ce8ff'], spreadY: 1, fall: 0 },
    spark: { count: 8, life: 560, size: [5, 9], dist: [22, 46], up: [-6, 6], colors: ['#fff3a0', '#ffffff', '#ffd1f5', '#c9f5ff'], spreadY: 1, fall: 10, star: true },
    dust: { count: 7, life: 420, size: [5, 10], dist: [14, 30], up: [-4, 6], colors: ['#ffffff', '#fff6fb'], spreadY: 0.25, fall: 0 },
    confetti: { count: 34, life: 1700, size: [7, 12], dist: [60, 190], up: [-260, -120], colors: ['#ff5cc6', '#ffd23a', '#3ddc97', '#5fb8ff', '#b65cff', '#ff8a4a', '#ffffff'], spreadY: 0.5, fall: 420, rect: true },
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  function burst(kind, x, y, layer = $('layer')) {
    if (RM && kind === 'confetti') return;
    const k = KINDS[kind];
    const sc = kind === 'confetti' ? 1 : G.S / 56;
    for (let i = 0; i < k.count; i++) {
      const a = (i / k.count) * Math.PI * 2 + rnd(-0.3, 0.3);
      const d = rnd(k.dist[0], k.dist[1]) * sc;
      const dx = Math.cos(a) * d;
      const dy = Math.sin(a) * d * k.spreadY + rnd(k.up[0], k.up[1]) * sc;
      const fall = k.fall * sc * rnd(0.7, 1.3);
      const size = rnd(k.size[0], k.size[1]) * sc;
      const p = document.createElement('div');
      p.className = 'part';
      p.style.cssText = `width:${size}px;height:${k.rect ? size * 0.5 : size}px;background:${k.colors[i % k.colors.length]};margin:${-size / 2}px 0 0 ${-size / 2}px;${k.rect ? 'border-radius:2px;' : k.star ? `border-radius:${size * 0.18}px;` : ''}`;
      layer.appendChild(p);
      const rot = k.star ? 45 : 0;
      const spin = rnd(-1, 1) * (k.rect ? 900 : 240);
      p.animate(
        [
          { transform: `translate(${x}px,${y}px) rotate(${rot}deg) scale(0.2)`, opacity: 0 },
          { transform: `translate(${x + dx * 0.15}px,${y + dy * 0.15}px) rotate(${rot}deg) scale(1)`, opacity: 1, offset: 0.12 },
          { transform: `translate(${x + dx * 0.8}px,${y + dy * 0.8}px) rotate(${rot + spin * 0.5}deg) scale(1)`, opacity: 1, offset: 0.55 },
          { transform: `translate(${x + dx}px,${y + dy + fall}px) rotate(${rot + spin}deg) scale(${k.rect ? 0.9 : 0.4})`, opacity: 0 },
        ],
        { duration: k.life, easing: 'ease-out' }
      ).finished.then(() => p.remove());
    }
  }

  // ---- the HUD
  function renderGoalCard() {
    const n = G.lv.friends.length;
    const size = n > 2 ? 22 : 26;
    let html = '';
    G.slots = [];
    G.friendKeys.forEach((key, k) => {
      html += `<div data-slot="${k}">${headSticker(key, 'happy', size, true)}</div>`;
    });
    if (n) html += '<span class="goalArrow">›</span>';
    html += `<div class="miniGoal"><img alt="" src="${A.cush.gold}">${starSvg(20, true, 'badge')}</div>`;
    $('goalRow').innerHTML = html;
    G.slots = [...$('goalRow').querySelectorAll('[data-slot]')];
  }
  function setSlot(k, got, anim) {
    const s = G.slots[k];
    if (!s) return;
    const st = s.firstElementChild;
    st.classList.toggle('dim', !got);
    if (got && anim) st.animate([{ transform: 'scale(0.4)' }, { transform: 'scale(1.25)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: ms(380), easing: 'ease-out' });
  }

  function hud() {
    const { st, lv } = G;
    $('hops').textContent = st.hops;
    const left = E.leftOf(lv, st.life);
    $('leftPill').textContent = `LEFT ${left}`;
    let can = G.feasible ? 3 : 2;
    if (G.hinted) can = Math.max(1, can - 1);
    $('meter').innerHTML = [0, 1, 2].map((i) => `<div style="margin-top:${i === 1 ? 0 : 4}px">${starSvg(i === 1 ? 26 : 21, i < can, 'meter')}</div>`).join('');
    const tip = $('tip');
    tip.classList.toggle('warn', !G.feasible && !G.over);
    tip.textContent = G.tipOverride || tipFor();
    $('undo').disabled = !G.hist.length || G.won;
    $('restart').disabled = st.hops === 0 && !G.over;
    $('hint').disabled = !!G.won;
  }
  function tipFor() {
    const { idx, def, st, lv } = G;
    if (!G.feasible) return "Some cushions can't be reached now. UNDO to go for 3 stars!";
    if (idx === 0 && st.hops === 0) return 'Swipe, use the arrow keys, or tap a cushion next to you to hop.';
    if (idx === 0) return 'Cushions puff away behind you. Clear them all, then hop onto the ★!';
    if (def.news === 'friends' && st.got !== lv.all) return 'Pick up the friend. The ★ opens when everyone is with you.';
    if (def.news === 'doubles') return 'Pink cushions take two hops to clear.';
    if (lv.friends.length && st.got !== lv.all) return 'Pick up every friend, clear every cushion, then hop onto the ★.';
    return 'Clear every cushion, then hop onto the ★.';
  }

  function check() {
    const r = E.search(G.lv, G.st, { limit: 60000 });
    G.feasible = !!r.path || r.aborted;
    G.plan = r.path;
  }

  // ---- levels
  function loadLevel(idx, { fresh = true } = {}) {
    closeCard();
    G.idx = idx;
    G.def = LEVELS[idx];
    G.lv = E.parse(G.def.map);
    G.st = E.newState(G.lv);
    G.hist = [];
    if (fresh) { G.hinted = false; G.asked = false; }
    G.over = false;
    G.won = false;
    G.busy = false;
    G.queue = [];
    G.tipOverride = null;
    G.friendKeys = G.lv.friends.map((_, k) => FRIENDS[(idx * 2 + k) % FRIENDS.length]);
    $('levelText').textContent = `LEVEL ${idx + 1}`;
    $('tier').textContent = TIER_NAMES[G.def.tier];
    $('tier').style.background = TIER_COLORS[G.def.tier];
    renderGoalCard();
    buildBoard();
    // the quilt fluffs in, corner to corner (sd_boardIn)
    Object.keys(G.cells).forEach((key) => {
      const i = Number(key);
      const [x, y] = xy(i);
      const c = G.cells[i];
      c.life = G.lv.life[i];
      paint(i);
      const d = RM ? 0 : (x + y) * 28;
      puffIn(c.c0, d);
      if (c.life === 2) puffIn(c.c1, d + 60);
      if (c.badge) c.badge.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: d + 120, fill: 'backwards' });
    });
    Sound.play('boardIn', 0.55);
    placePiece(G.player, G.st.cur);
    face('idle');
    G.player.el.animate([{ opacity: 0, transform: `translate(${G.player.pos[0]}px,${G.player.pos[1] - G.S * 0.6}px)` }, { opacity: 1, transform: `translate(${G.player.pos[0]}px,${G.player.pos[1]}px)` }], { duration: ms(360), delay: ms(260), easing: 'cubic-bezier(.3,1.5,.55,1)', fill: 'backwards' });
    Object.values(G.friends).forEach((p, k) => p.el.animate([{ opacity: 0, transform: `translate(${p.pos[0]}px,${p.pos[1]}px) scale(0.3)` }, { opacity: 1, transform: `translate(${p.pos[0]}px,${p.pos[1]}px) scale(1)` }], { duration: ms(320), delay: ms(320 + k * 90), easing: 'cubic-bezier(.3,1.5,.55,1)', fill: 'backwards' }));
    G.lv.friends.forEach((_, k) => setSlot(k, false, false));
    setGoalLock(false);
    check();
    hud();
    if (G.def.news && !save.seenNews[G.def.news]) {
      save.seenNews[G.def.news] = true;
      store();
      setTimeout(() => showBanner(NEWS[G.def.news]), ms(700));
    }
  }

  function relayout() {
    if (!G.lv) return;
    const S0 = G.S;
    measure();
    if (G.S === S0) return;
    // rebuild at the new size, keeping the state
    const st = G.st;
    buildBoard();
    Object.keys(G.cells).forEach((key) => {
      const i = Number(key);
      G.cells[i].life = i === G.lv.goal ? 1 : st.life[i];
      paint(i);
    });
    placePiece(G.player, st.cur);
    Object.entries(G.friends).forEach(([cell, p]) => { p.el.hidden = !!(st.got & G.lv.fbit[cell]); });
    setGoalLock(false);
  }

  // ---- moving
  function tryDir(dx, dy) {
    const [x, y] = xy(G.st.cur);
    const nx = x + dx;
    const ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= G.lv.w || ny >= G.lv.h) return bonk(dx, dy);
    tryCell(ny * G.lv.w + nx, dx, dy);
  }
  function tryCell(j, dx, dy) {
    const { lv, st } = G;
    if (st.life[j] <= 0) return bonk(dx, dy);
    if (j === lv.goal && st.got !== lv.all) {
      bonk(dx, dy);
      $('goalCard').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 320 });
      flashTip('Pick up every friend first. Then the ★ opens!');
      return;
    }
    hop(j);
  }
  function flashTip(text) {
    G.tipOverride = text;
    hud();
    clearTimeout(G.tipT);
    G.tipT = setTimeout(() => { G.tipOverride = null; hud(); }, 2200);
  }

  async function bonk(dx, dy) {
    Sound.play('bonk', 0.5);
    G.busy = true;
    const n = G.S * 0.14;
    await G.player.squash.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx * n}px,${dy * n}px) scale(${dx ? 0.86 : 1.1},${dy ? 0.86 : 1.1})`, offset: 0.4 }, { transform: 'translate(0,0)' }], { duration: ms(200), easing: 'ease-out' }).finished;
    G.busy = false;
    next();
  }

  async function moveTo(p, cell, dur) {
    const [x0, y0] = p.pos;
    placePiece(p, cell);
    const [x1, y1] = p.pos;
    const lift = G.S * 0.34;
    const a = p.el.animate([{ transform: `translate(${x0}px,${y0}px)` }, { transform: `translate(${x1}px,${y1}px)` }], { duration: dur, easing: 'ease-in-out' });
    p.lift.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-lift}px)`, easing: 'ease-in', offset: 0.5 }, { transform: 'translateY(0)' }], { duration: dur, easing: 'ease-out' });
    p.squash.animate([{ transform: 'scale(1)' }, { transform: 'scale(0.9,1.12)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: dur });
    p.shadow.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0.6)', opacity: 0.5, offset: 0.5 }, { transform: 'scale(1)', opacity: 1 }], { duration: dur });
    await a.finished;
    p.squash.animate([{ transform: 'scale(1.14,0.86)' }, { transform: 'scale(0.96,1.05)', offset: 0.55 }, { transform: 'scale(1)' }], { duration: ms(220), easing: 'ease-out' });
  }

  async function hop(j) {
    const prev = G.st;
    const nxt = E.step(G.lv, prev, j);
    G.hist.push(prev);
    G.st = nxt;
    G.busy = true;
    clearGlow();
    Sound.play('hop', 0.6);
    setCell(prev.cur, nxt.life[prev.cur]);
    await moveTo(G.player, j, ms(170));
    const [cx, cy] = center(j);
    burst('dust', cx, cy + G.S * 0.36);
    if (nxt.got !== prev.got) collect(j);
    if (nxt.done) return win();
    check();
    hud();
    if (!E.moves(G.lv, G.st).length) return stuck();
    G.busy = false;
    next();
  }

  function next() {
    if (G.busy || G.over || !G.queue.length) return;
    const fn = G.queue.shift();
    fn();
  }
  function input(fn) {
    if (G.over || document.getElementById('overlay').hidden === false) return;
    if (G.busy) {
      if (G.queue.length < 2) G.queue.push(fn);
      return;
    }
    fn();
  }

  // a friend hopped onto: happy, a squeak, and off to its slot on the goal card
  function collect(cell) {
    const p = G.friends[cell];
    if (!p) return;
    Sound.play('squeak', 0.7);
    p.img.src = A.heads[p.key].happy;
    const from = p.img.getBoundingClientRect();
    const slot = G.slots[p.k].getBoundingClientRect();
    p.el.hidden = true;
    const fly = document.createElement('img');
    fly.src = p.img.src;
    fly.alt = '';
    fly.style.cssText = `position:fixed;left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;z-index:40;pointer-events:none`;
    document.body.appendChild(fly);
    const dx = slot.left + slot.width / 2 - (from.left + from.width / 2);
    const dy = slot.top + slot.height / 2 - (from.top + from.height / 2);
    const sc = slot.width / from.width;
    fly.animate(
      [
        { transform: 'translate(0,0) scale(1)' },
        { transform: `translate(0,${-G.S * 0.5}px) scale(1.2)`, offset: 0.25 },
        { transform: `translate(${dx}px,${dy}px) scale(${sc})` },
      ],
      { duration: ms(620), easing: 'ease-in-out' }
    ).finished.then(() => {
      fly.remove();
      setSlot(p.k, true, true);
      setGoalLock(true);
    });
  }

  function undo() {
    if (!G.hist.length || G.won) return;
    clearGlow();
    const was = G.st;
    const prev = G.hist.pop();
    G.st = prev;
    if (G.over) { G.over = false; closeCard(); }
    face('idle');
    Sound.play('undo', 0.7);
    setCell(prev.cur, prev.life[prev.cur]);
    if (was.got !== prev.got) {
      const p = G.friends[was.cur];
      p.el.hidden = false;
      p.img.src = A.heads[p.key].idle;
      p.el.animate([{ transform: `translate(${p.pos[0]}px,${p.pos[1]}px) scale(0.3)`, opacity: 0 }, { transform: `translate(${p.pos[0]}px,${p.pos[1]}px) scale(1)`, opacity: 1 }], { duration: ms(300), easing: 'cubic-bezier(.3,1.5,.55,1)' });
      setSlot(p.k, false, false);
    }
    setGoalLock(false);
    G.busy = true;
    moveTo(G.player, prev.cur, ms(170)).then(() => {
      G.busy = false;
      next();
    });
    check();
    hud();
  }

  // jump back to an earlier state (the hint's rewind)
  function rewindTo(k) {
    const target = G.hist[k];
    const was = G.st;
    G.hist.length = k;
    G.st = target;
    Object.keys(G.cells).forEach((key) => setCell(Number(key), Number(key) === G.lv.goal ? 1 : target.life[key]));
    Object.entries(G.friends).forEach(([cell, p]) => {
      const got = !!(target.got & G.lv.fbit[cell]);
      if (!got && p.el.hidden) {
        p.el.hidden = false;
        p.img.src = A.heads[p.key].idle;
      }
      setSlot(p.k, got, false);
    });
    setGoalLock(false);
    moveTo(G.player, target.cur, ms(260));
    return was.hops - target.hops;
  }

  function restart() {
    if (G.st.hops === 0 && !G.over) return;
    loadLevel(G.idx, { fresh: false });
  }

  function clearGlow() {
    if (G.glow) { G.glow.remove(); G.glow = null; }
  }
  function askHint() {
    if (G.won || G.busy) return;
    if (!G.asked) {
      showHintCard();
      return;
    }
    giveHint();
  }
  function giveHint() {
    G.hinted = true;
    G.asked = true;
    let back = 0;
    let r = E.search(G.lv, G.st, { limit: 300000 });
    if (!r.path) {
      // no full clear from here: go back to the last spot that has one
      for (let k = G.hist.length - 1; k >= 0; k--) {
        const t = E.search(G.lv, G.hist[k], { limit: 300000 });
        if (t.path) { back = rewindTo(k); r = t; break; }
      }
      if (G.over) { G.over = false; closeCard(); face('idle'); }
    }
    check();
    hud();
    if (!r.path || !r.path.length) return;
    const j = r.path[0];
    Sound.play('hint', 0.6);
    clearGlow();
    const [x, y] = xy(j);
    const g = document.createElement('div');
    g.className = 'hintGlow';
    const S = G.S;
    g.style.cssText = `left:${x * S + S * 0.04}px;top:${y * S + S * 0.04}px;width:${S * 0.92}px;height:${S * 0.9}px`;
    $('layer').insertBefore(g, $('layer').firstChild);
    G.glow = g;
    setTimeout(() => { if (G.glow === g) clearGlow(); }, 3200);
    const [px, py] = xy(G.st.cur);
    const dx = x - px;
    const dy = y - py;
    const n = S * 0.1;
    G.player.squash.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${dx * n}px,${dy * n - S * 0.12}px)`, offset: 0.4 }, { transform: 'translate(0,0)' }], { duration: ms(360), delay: back ? ms(300) : 0, easing: 'ease-out' });
    if (back) flashTip(`Went back ${back} hop${back === 1 ? '' : 's'}. Try the glowing cushion!`);
  }

  // ---- the end of a level
  async function win() {
    G.over = true;
    G.won = true;
    G.busy = true;
    hud();
    const S = G.S;
    const [cx, cy] = center(G.lv.goal);
    Sound.play('land', 0.6);
    face('happy');
    burst('spark', cx, cy);
    await wait(ms(160));
    Sound.play('solve', 0.7);
    burst('confetti', cx, cy - S * 0.3);
    for (let k = 0; k < 2; k++) {
      await G.player.lift.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-S * 0.4}px)`, offset: 0.45 }, { transform: 'translateY(0)' }], { duration: ms(340), easing: 'ease-in-out' }).finished;
      G.player.squash.animate([{ transform: 'scale(1.12,0.88)' }, { transform: 'scale(1)' }], { duration: ms(160) });
    }
    await wait(ms(380));
    const left = E.leftOf(G.lv, G.st.life);
    const stars = E.starsFor(left, G.hinted);
    const unlocked = G.idx + 1 < LEVELS.length;
    if (!save.best[G.idx] || stars > save.best[G.idx]) save.best[G.idx] = stars;
    store();
    showResult({ stars, left, hops: G.st.hops, unlocked });
  }

  async function stuck() {
    G.over = true;
    G.busy = false;
    hud();
    face('sad');
    Sound.play('wrong', 0.6);
    const sz = G.player.size;
    PLAYER_EYES.forEach(([ex, ey], k) => {
      const t = document.createElement('div');
      t.className = 'tear';
      t.style.left = `${ex * 100 - 6}%`;
      t.style.top = `${ey * 100 + 4}%`;
      G.player.squash.querySelector('.breathe').appendChild(t);
      t.animate([{ opacity: 0, transform: 'translateY(0) rotate(-45deg)' }, { opacity: 1, offset: 0.2 }, { opacity: 0, transform: `translateY(${sz * 0.35}px) rotate(-45deg)` }], { duration: ms(1100), delay: k * 140, easing: 'ease-in' }).finished.then(() => t.remove());
    });
    G.player.squash.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(-5deg)' }, { transform: 'rotate(0)' }], { duration: ms(700), delay: 200 });
    await wait(ms(1000));
    if (G.over && !G.won) showStuck();
  }

  // ---- the banner
  async function showBanner(b) {
    const el = $('banner');
    el.innerHTML = `<div class="bannerText">${b.text}</div><div class="bannerSub">${b.sub}</div>`;
    el.hidden = false;
    Sound.play('news', 0.5);
    await el.animate(
      [
        { opacity: 0, transform: 'scale(0.3) rotate(-12deg)' },
        { opacity: 1, transform: 'scale(1) rotate(-3deg)', offset: 0.12 },
        { opacity: 1, transform: 'scale(1) rotate(-3deg)', offset: 0.85 },
        { opacity: 0, transform: 'scale(1.25) rotate(0deg)' },
      ],
      { duration: 2600, easing: 'ease-out' }
    ).finished;
    el.hidden = true;
  }

  // ---- cards
  function showCard(html, { tint } = {}) {
    const o = $('overlay');
    o.classList.remove('out');
    o.style.setProperty('--tint', tint || 'rgba(40,8,80,0.55)');
    o.innerHTML = `<div class="tint"></div><div class="card"><div class="cardRim"><div class="cardFill">${html}</div></div></div>`;
    o.hidden = false;
    const b = o.querySelector('button');
    if (b) setTimeout(() => b.focus({ preventScroll: true }), 50);
    return o;
  }
  function closeCard() {
    const o = $('overlay');
    if (o.hidden) return;
    o.classList.add('out');
    setTimeout(() => { if (o.classList.contains('out')) { o.hidden = true; o.innerHTML = ''; o.classList.remove('out'); } }, 180);
  }
  function on(id, fn, sound = 'select') {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => { if (sound) Sound.play(sound, 0.6); fn(); });
  }

  function showHow(then) {
    showCard(`${titleSvg('HOW TO PLAY', 'pink', 28)}
      <div class="rules">
        <div class="rule"><div class="ruleNum">1</div><div><div class="ruleTitle">HOP</div><div class="ruleLine">Swipe, use the arrow keys, or tap a cushion next to you.</div></div></div>
        <div class="rule"><div class="ruleNum">2</div><div><div class="ruleTitle">PUFF!</div><div class="ruleLine">The cushion you hop off puffs away. No going back!</div></div></div>
        <div class="rule"><div class="ruleNum">3</div><div><div class="ruleTitle">THE ★ CUSHION</div><div class="ruleLine">Hop onto it to finish. Clear every other cushion first for 3 stars.</div></div></div>
      </div>
      <div class="twistHead">LATER ON</div>
      <div class="twist"><span class="twistName">FRIENDS · </span>pick them all up. The ★ opens when everyone is with you.</div>
      <div class="twist"><span class="twistName">DOUBLES · </span>pink cushions take two hops to clear.</div>
      ${button('green', 'GOT IT!', { id: 'cGot', fs: 18, cls: 'big' })}`);
    on('cGot', () => {
      save.seenHow = true;
      store();
      closeCard();
      if (then) then();
    });
  }

  function showLevels() {
    const tiles = LEVELS.map((L, i) => {
      const best = save.best[i] || 0;
      const stars = [0, 1, 2].map((k) => starSvg(13, k < best, 'meter')).join('');
      return `<div class="lvTile">${button(i === G.idx ? 'pink' : 'purple', String(i + 1), { id: `lv${i}`, fs: 20 })}<div class="lvStars">${stars}</div></div>`;
    }).join('');
    showCard(`${titleSvg('SQUISH HOP', 'pink', 30)}<div class="sub">PICK A LEVEL</div><div class="levels">${tiles}</div>
      <div class="btnRow">${button('white', 'HOW TO PLAY', { id: 'cHow', fs: 14 })}${button('white', save.muted ? 'SOUND: OFF' : 'SOUND: ON', { id: 'cMute', fs: 14 })}</div>`);
    LEVELS.forEach((_, i) => on(`lv${i}`, () => loadLevel(i)));
    on('cHow', () => showHow(showLevels));
    on('cMute', () => { save.muted = !save.muted; store(); showLevels(); });
  }

  function showPause() {
    if (!$('overlay').hidden) return;
    showCard(`${titleSvg('PAUSED', 'pink', 30)}<div class="col">
      ${button('green', 'RESUME', { id: 'cRes', fs: 18 })}
      ${button('purple', 'RESTART', { id: 'cRe', fs: 16 })}
      ${button('white', 'LEVELS', { id: 'cLv', fs: 16 })}</div>`);
    on('cRes', closeCard);
    on('cRe', () => loadLevel(G.idx, { fresh: false }));
    on('cLv', showLevels);
  }

  function showHintCard() {
    showCard(`${titleSvg('NEED A HINT?', 'gold', 28)}
      <div class="body">We'll show you the next hop. A hint makes this level give one star less.</div>
      <div class="btnRow">${button('white', 'NO THANKS', { id: 'cNo', fs: 15 })}${button('gold', 'SHOW ME', { id: 'cShow', fs: 18, cls: 'big' })}</div>`);
    on('cNo', closeCard);
    on('cShow', () => { closeCard(); setTimeout(giveHint, 200); }, null);
  }

  function showStuck() {
    const locked = G.lv.nbrs[G.st.cur].some((j) => j === G.lv.goal) && G.st.got !== G.lv.all;
    showCard(`${titleSvg('STUCK!', 'pink', 32)}
      <div class="rock">${headSticker(PLAYER, 'sad', 86, false)}</div>
      <div class="body">${locked ? 'The ★ is shut until every friend is with you, and there is nowhere else to hop.' : 'There is no cushion left to hop onto.'}</div>
      <div class="btnRow">${button('white', 'UNDO', { id: 'cUndo', fs: 15 })}${button('pink', 'RETRY', { id: 'cRetry', fs: 18, cls: 'big' })}</div>`, { tint: 'rgba(80,0,30,0.5)' });
    on('cUndo', undo, null);
    on('cRetry', () => loadLevel(G.idx, { fresh: false }));
  }

  function showResult(res) {
    const tier = TIER_NAMES[G.def.tier];
    const big = (i) => i === 1;
    const stars = [0, 1, 2].map((i) => {
      const size = big(i) ? 74 : 60;
      return `<div class="starSlot" style="width:${size + 20}px;height:${size + 20}px;margin-top:${big(i) ? -12 : 6}px"><div class="rays" style="width:${size * 1.8}px;height:${size * 1.8}px"></div><div class="star" data-lit="${i < res.stars ? 1 : 0}" style="opacity:0">${starSvg(size, i < res.stars, 'card')}</div></div>`;
    }).join('');
    const last = G.idx + 1 >= LEVELS.length;
    showCard(`<div class="pop">${titleSvg(TITLES[res.stars], res.stars === 3 ? 'gold' : 'pink', res.stars === 3 ? 30 : 30)}</div>
      <div class="sub">LEVEL ${G.idx + 1} · ${tier} · ${res.hops} HOPS · ${res.left} LEFT${G.hinted ? ' · HINT' : ''}</div>
      ${res.left > 0 && !G.hinted ? '<div class="hintLine">Clear every cushion before the ★ for 3 stars!</div>' : ''}
      ${G.hinted ? '<div class="hintLine">A hint costs one star</div>' : ''}
      <div class="stars">${stars}</div>
      ${res.unlocked && !last ? `<div class="sub" style="color:#16a86a">LEVEL ${G.idx + 2} IS OPEN</div>` : ''}
      <div class="btnRow" id="resBtns" style="opacity:0">${button('white', 'MENU', { id: 'cMenu', fs: 15 })}${button('purple', 'REPLAY', { id: 'cReplay', fs: 15 })}${last ? '' : button('green', 'NEXT ▶', { id: 'cNext', fs: 18, cls: 'big' })}</div>`);
    const STEP = 480;
    const t = document.querySelector('#overlay .pop');
    if (t) t.animate([{ transform: 'scale(0.3)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.6 }, { transform: 'scale(1)' }], { duration: ms(420), delay: 80, easing: 'ease-out', fill: 'backwards' });
    const slots = [...document.querySelectorAll('#overlay .starSlot')];
    slots.forEach((slot, i) => {
      const s = slot.querySelector('.star');
      const lit = s.dataset.lit === '1';
      setTimeout(() => {
        Sound.play(lit ? `star${i + 1}` : 'starEmpty', 0.7);
        s.style.opacity = 1;
        s.animate(lit ? [{ transform: 'scale(0) rotate(-40deg)', opacity: 0 }, { transform: 'scale(1.18) rotate(4deg)', opacity: 1, offset: 0.6 }, { transform: 'scale(1) rotate(0)' }] : [{ transform: 'scale(1.5)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: ms(lit ? 520 : 300), easing: 'ease-out' });
        if (lit) {
          slot.querySelector('.rays').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
          const r = slot.getBoundingClientRect();
          const o = $('overlay');
          burstFixed(r.left + r.width / 2, r.top + r.height / 2, o);
        }
      }, ms(380 + i * STEP));
    });
    if (res.stars === 3) setTimeout(() => Sound.play('perfect', 0.7), ms(380 + 3 * STEP));
    setTimeout(() => {
      const b = $('resBtns');
      if (b) b.animate([{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 320, easing: 'ease-out', fill: 'forwards' });
    }, ms(380 + 2 * STEP + 300));
    on('cMenu', showLevels);
    on('cReplay', () => loadLevel(G.idx));
    on('cNext', () => loadLevel(G.idx + 1));
  }
  // gold sparks round a result star (fx.js 'gold')
  function burstFixed(x, y, host) {
    if (RM) return;
    const colors = ['#ffd23a', '#fff3a0', '#ffffff'];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + rnd(-0.3, 0.3);
      const d = rnd(40, 80);
      const s = rnd(6, 11);
      const p = document.createElement('div');
      p.style.cssText = `position:fixed;left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px;border-radius:${s * 0.18}px;background:${colors[i % 3]};z-index:60;pointer-events:none`;
      host.appendChild(p);
      p.animate([{ transform: 'translate(0,0) rotate(45deg) scale(0.2)', opacity: 0 }, { transform: `translate(${Math.cos(a) * d * 0.8}px,${Math.sin(a) * d * 0.8}px) rotate(45deg) scale(1)`, opacity: 1, offset: 0.5 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 18}px) rotate(45deg) scale(0.4)`, opacity: 0 }], { duration: 700, easing: 'ease-out' }).finished.then(() => p.remove());
    }
  }

  // ---- input
  const KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
  window.addEventListener('keydown', (e) => {
    if (!$('overlay').hidden) {
      if (e.key === 'Escape') closeCard();
      return;
    }
    if (KEYS[e.key]) {
      e.preventDefault();
      const [dx, dy] = KEYS[e.key];
      input(() => tryDir(dx, dy));
    } else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace' || e.key === 'u') {
      e.preventDefault();
      $('undo').click();
    } else if (e.key === 'r' || e.key === 'R') {
      $('restart').click();
    } else if (e.key === 'h' || e.key === 'H') {
      $('hint').click();
    } else if (e.key === 'Escape') {
      showPause();
    }
  });

  // swipes (one hop per 28px of drag, so a long drag can turn corners) and taps
  const area = $('area');
  let drag = null;
  area.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: false, id: e.pointerId };
    try { area.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  area.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    const th = Math.max(26, G.S * 0.5);
    if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
    drag.moved = true;
    drag.x = e.clientX;
    drag.y = e.clientY;
    if (Math.abs(dx) > Math.abs(dy)) input(() => tryDir(Math.sign(dx), 0));
    else input(() => tryDir(0, Math.sign(dy)));
  });
  area.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.moved || Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 10) return;
    const r = $('layer').getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / G.S);
    const y = Math.floor((e.clientY - r.top) / G.S);
    if (x < 0 || y < 0 || x >= G.lv.w || y >= G.lv.h) return;
    const [px, py] = xy(G.st.cur);
    if (x === px && y === py) {
      // a tap on the squishy: a squeak and a wiggle, just for fun
      Sound.play('squeak', 0.6);
      G.player.squash.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-10deg) scale(1.06)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(0)' }], { duration: ms(360) });
      return;
    }
    if (Math.abs(x - px) + Math.abs(y - py) === 1) input(() => tryCell(y * G.lv.w + x, x - px, y - py));
  });
  area.addEventListener('pointercancel', () => { drag = null; });
  // a press on a cushion picture mustn't start the browser's image drag
  area.addEventListener('dragstart', (e) => e.preventDefault());

  // the buttons squash as they're pressed (SdButton / RoundButton)
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest && e.target.closest('.sd, .round');
    if (b && !b.disabled) {
      b.classList.add('down');
      const up = () => { b.classList.remove('down'); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }
  });

  $('undo').addEventListener('click', () => input(undo));
  $('restart').addEventListener('click', () => { Sound.play('select', 0.6); restart(); });
  $('hint').addEventListener('click', () => { Sound.play('select', 0.6); askHint(); });
  $('back').addEventListener('click', () => { Sound.play('tap', 0.6); showPause(); });
  window.addEventListener('resize', () => { clearTimeout(G.rz); G.rz = setTimeout(relayout, 120); });

  // ---- start
  function start() {
    loadLevel(0);
    if (!save.seenHow) showHow();
  }
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
  fontsReady.then(start);
  window.SquishHop = { G, loadLevel, tryDir, undo };
})();
</script>
</body>
</html>
