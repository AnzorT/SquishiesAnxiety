<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squish Soundboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Squish Soundboard, in the look of the Squad House v6 design: its Dance
   Club room with the most expensive walls, floor and ceiling, its club
   items (RenoDraw art, art/items), its DJ crew (art/dj-crew.js) and club fog
   (art/club-fx.js), and its wood drawer, tabs, catalog book, cards, buttons
   and toast. Two screens on the house's 852 x 393 frame: the Dance Room,
   where a DJ Console from the catalog opens the soundboard, and the
   soundboard: the club stage over a mixer drawer with VOICE, FX and MUSIC.
   One look: no dark mode, like the house. */
:root {
  --ink: #6b4426; --ink2: #5b3418; --mute: #8a6a4a; --orange: #c4651f; --cream: #fff6e2; --page: #2a1d14;
  --brass: linear-gradient(180deg,#ffe9a0 0%,#e2b14a 60%,#b8862a 100%);
  --woodBtn: radial-gradient(circle at 35% 30%, #f3cc98 0%, #d39a5e 55%, #ad723c 100%);
  --green: repeating-linear-gradient(90deg, rgba(40,70,30,0.08) 0px, rgba(40,70,30,0.08) 2px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 22px), linear-gradient(180deg,#b6dc96 0%,#86bd68 55%,#679f4c 100%);
  --wood: repeating-linear-gradient(90deg, rgba(107,68,38,0.08) 0px, rgba(107,68,38,0.08) 2px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 26px), linear-gradient(180deg,#e6b47c 0%,#cf955a 55%,#b47a42 100%);
  --fred: 'Fredoka', 'Nunito', 'Trebuchet MS', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); font-family: 'Nunito', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #3ff0ff; outline-offset: 2px; }
img { -webkit-user-drag: none; }

/* the house's frame: 852 x 393, scaled to fit */
#app { position: absolute; left: 50%; top: 50%; width: 852px; height: 393px; transform-origin: 50% 50%; overflow: hidden; border-radius: 22px; background: #150b1e; box-shadow: 0 0 0 2px #3b2818, 0 14px 40px rgba(0,0,0,0.55); }
.screen { position: absolute; inset: 0; }
.scene { position: absolute; left: 0; top: 0; width: 852px; height: 393px; overflow: hidden; }
.scene img.room { position: absolute; left: 0; width: 852px; height: 393px; display: block; pointer-events: none; }
.item { position: absolute; display: block; pointer-events: none; }
.item.float { animation: itFloat 2.6s ease-in-out infinite; }
.item.holo { animation: itHolo 3.2s steps(1) infinite; }
.item.float.holo { animation: itFloat 2.6s ease-in-out infinite, itHolo 3.2s steps(1) infinite; }
@keyframes itFloat { 50% { translate: 0 -3px; } }
@keyframes itHolo { 0%, 100% { opacity: 1; } 47% { opacity: 0.86; } 49% { opacity: 1; } 83% { opacity: 0.9; } 85% { opacity: 1; } }
.cr { position: absolute; display: block; }
.cr img, .cr .dj { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cr .hop, .cr .sq { position: absolute; inset: 0; transform-origin: 50% 96%; }
.cr .shadow { position: absolute; left: 18%; right: 18%; bottom: 0; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,8,10,0.45), rgba(20,8,10,0)); }

/* map button (the house's) */
.mapBtn { position: absolute; left: 12px; top: 8px; z-index: 50; display: flex; flex-direction: column; align-items: center; padding: 0; border: none; background: none; filter: drop-shadow(0 2px 0 rgba(107,68,38,0.45)); }
.mapBtn:active { transform: translateY(2px); }
.mapBtn span { margin-top: 1px; font-family: var(--fred); font-weight: 700; font-size: 12px; color: #fff6e2; white-space: nowrap; text-shadow: 0 1.5px 0 #6b4426, 1.3px 0 0 #6b4426, -1.3px 0 0 #6b4426, 0 -1.3px 0 #6b4426; }

/* chips (the catalog's header chips) */
.chips { position: absolute; right: 12px; top: 10px; z-index: 50; display: flex; gap: 6px; }
.chip { display: flex; align-items: center; gap: 4px; height: 25px; padding: 0 9px 0 5px; border-radius: 7px; border: 2px solid #6b4426; background: #fff6e2; box-shadow: 0 2px 0 #6b4426; font-family: var(--fred); font-weight: 700; font-size: 12.5px; color: #5b3418; white-space: nowrap; }
.chip.lv { background: var(--brass); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 2px 0 #6b4426; padding: 0 8px; }
.coin { flex: none; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4 0%, #f2c255 45%, #b8862a 100%); box-shadow: 0 0 0 1.5px #6b4426; display: inline-block; }

/* wood: the drawer */
.wood { border: 2.5px solid #6b4426; border-radius: 16px; background: var(--wood); box-shadow: inset 0 2px 0 rgba(255,240,210,0.55), inset 0 -3px 0 rgba(107,68,38,0.25), 0 4px 0 #6b4426, 0 10px 18px rgba(60,30,10,0.35); }
.rivet { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c4, #e2b14a 55%, #8a5d1a); box-shadow: 0 0 0 1px #6b4426; }
.rivet.tl { left: 5px; top: 5px; } .rivet.tr { right: 5px; top: 5px; } .rivet.bl { left: 5px; bottom: 5px; } .rivet.br { right: 5px; bottom: 5px; }
.note { display: flex; flex-direction: column; padding: 4px 8px 5px; border-radius: 7px; background: #fff6e2; box-shadow: 0 0 0 2px #6b4426, 0 2.5px 0 2px rgba(107,68,38,0.35); transform: rotate(-2deg); }
.cap { font-size: 9px; font-weight: 900; letter-spacing: 0.09em; color: #c4651f; white-space: nowrap; }
.nt { font-family: var(--fred); font-weight: 700; font-size: 13px; line-height: 1.15; color: #5b3418; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ns { font-size: 9.5px; font-weight: 700; line-height: 1.2; color: #8a6a4a; white-space: nowrap; }
.btn { height: 26px; padding: 0 10px; border-radius: 7px; border: 2px solid #6b4426; background: var(--brass); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 2px 0 #6b4426; font-family: var(--fred); font-weight: 700; font-size: 12.5px; color: #5b3418; white-space: nowrap; }
.btn:active, .rbtn:active, .pal:active, .song:active { transform: translateY(2px); }
.btn.wood2 { background: var(--woodBtn); color: #fff6e2; text-shadow: 0 1.5px 0 #6b4426, 1px 0 0 #6b4426, -1px 0 0 #6b4426; }
.btn.green { background: var(--green); color: #fff6e2; text-shadow: 0 1.5px 0 #6b4426, 1px 0 0 #6b4426, -1px 0 0 #6b4426; }
.btn.grey { background: linear-gradient(180deg,#e2dacd 0%,#bdb2a2 100%); border-color: #7a6a58; box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 2px 0 #7a6a58; color: #5a4a3a; }
.rbtn { flex: none; padding: 0; border-radius: 50%; border: 2.5px solid #6b4426; display: flex; align-items: center; justify-content: center; }
.rbtn.brass { background: var(--brass); box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 3px 0 #6b4426, 0 6px 10px rgba(60,30,10,0.25); }
.rbtn.woody { background: var(--woodBtn); box-shadow: inset 0 0 0 2px rgba(255,236,200,0.3), 0 2.5px 0 #6b4426; }

/* toast (the house's) */
#toast { position: absolute; left: 50%; top: 52px; z-index: 1100; max-width: 560px; transform: translate(-50%,0) rotate(-1.2deg); padding: 6px 14px; border-radius: 7px; background: #fff6e2; box-shadow: 0 0 0 2px #6b4426, 0 3px 0 2px rgba(107,68,38,0.35), 0 8px 14px rgba(60,30,10,0.25); color: #5b3418; font-family: var(--fred); font-weight: 600; font-size: 13.5px; text-align: center; pointer-events: none; }
#fade { position: absolute; inset: 0; z-index: 2000; background: #150b1e; opacity: 0; pointer-events: none; }
#turn { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) rotate(-1.2deg); padding: 6px 14px; border-radius: 7px; background: #fff6e2; box-shadow: 0 0 0 2px #6b4426, 0 3px 0 2px rgba(107,68,38,0.35); color: #5b3418; font-family: var(--fred); font-weight: 600; font-size: 14px; white-space: nowrap; }

/* ---- the Dance Room */
#cribDrawer { position: absolute; left: 50%; bottom: -8px; z-index: 40; display: flex; align-items: flex-end; gap: 12px; padding: 8px 16px 15px; transform: translateX(-50%); }
.dBtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: none; background: none; filter: drop-shadow(0 2px 0 rgba(107,68,38,0.45)); }
.dBtn:active { transform: translateY(2px); }
.dBtn .lbl { font-family: var(--fred); font-weight: 700; font-size: 11.5px; line-height: 1.25; color: #5b3418; padding: 0 7px; border-radius: 6px; background: #fff6e2; box-shadow: 0 0 0 1.5px #6b4426; white-space: nowrap; }
.dBtn .lock { position: absolute; right: -4px; top: -4px; width: 20px; height: 20px; }
.spotTag { position: absolute; z-index: 30; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: none; background: none; }
.spotTag .note { transform: rotate(-2deg); align-items: center; }
.stamp { padding: 0 6px; border-radius: 4px; border: 2px solid #c23a3a; background: #fff6e2; font-family: var(--fred); font-weight: 700; font-size: 10.5px; line-height: 15px; color: #c23a3a; transform: rotate(-3deg); white-space: nowrap; }
.sbTag { position: absolute; z-index: 30; transform: translate(-50%, -100%); padding: 0; border: none; background: none; }
.sbTag .face { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 8px; border: 2.5px solid #6b4426; background: var(--brass); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 3px 0 #6b4426, 0 0 16px rgba(255,225,79,0.55); font-family: var(--fred); font-weight: 700; font-size: 14px; color: #5b3418; white-space: nowrap; }
.sbTag .face.pulse { animation: tagPulse 1s ease-in-out infinite alternate; }
@keyframes tagPulse { to { transform: scale(1.07); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 3px 0 #6b4426, 0 0 26px rgba(255,225,79,0.9); } }
.ghost { position: absolute; border-radius: 50%; border: 3px dashed #ffe14f; background: radial-gradient(closest-side, rgba(60,30,10,0.45), rgba(60,30,10,0.18)); box-shadow: 0 0 0 1.5px rgba(107,68,38,0.6), 0 0 14px rgba(255,225,79,0.7); animation: ghostPulse 1.4s ease-in-out infinite alternate; }
@keyframes ghostPulse { to { opacity: 0.7; } }

/* the catalog (the house's book) */
#overlay { position: absolute; inset: 0; z-index: 1000; }
.dim { position: absolute; inset: 0; background: rgba(40,22,10,0.55); }
.book { position: absolute; left: 0; top: 0; width: 852px; height: 393px; animation: hsPop 0.2s ease-out both; }
@keyframes hsPop { from { scale: 0.96; opacity: 0; } to { scale: 1; opacity: 1; } }
#app.cat .chips { visibility: hidden; }
.roomTab { position: absolute; left: 22px; top: 3px; height: 27px; display: flex; align-items: center; gap: 5px; padding: 0 12px 2px 9px; border: 2.5px solid #6b4426; border-bottom: none; border-radius: 9px 9px 0 0; background: #fff6e2; box-shadow: inset 0 2px 0 rgba(255,255,255,0.55); color: #5b3418; font-family: var(--fred); font-weight: 700; font-size: 13px; white-space: nowrap; }
.bookHead { position: absolute; right: 38px; top: 1px; height: 28px; display: flex; align-items: center; gap: 6px; }
.closeBtn { width: 25px; height: 25px; border-width: 2px; }
.board { position: absolute; left: 16px; top: 29px; width: 800px; height: 360px; border-radius: 16px; background: linear-gradient(180deg,#8f5e36 0%,#7a4c2a 55%,#6b4426 100%); box-shadow: 0 0 0 2.5px #4a2c14, inset 0 2px 0 rgba(255,220,170,0.3), 0 14px 30px rgba(30,15,5,0.55); }
.board::before { content: ''; position: absolute; inset: 3px; border-radius: 13px; border: 1.5px dashed rgba(255,226,180,0.4); pointer-events: none; }
.pageL, .pageR { position: absolute; top: 8px; width: 388px; height: 344px; }
.pageL { left: 9px; border-radius: 10px 3px 3px 10px; background: linear-gradient(90deg,#fff6e2 0%,#fff6e2 86%,#efdcb6 100%); box-shadow: inset -12px 0 16px -10px rgba(107,68,38,0.4), 0 2px 0 #4a2c14, -2px 2px 0 #e8d2a6, -3px 4px 0 #d9bf92; }
.pageR { left: 403px; border-radius: 3px 10px 10px 3px; background: linear-gradient(270deg,#fff6e2 0%,#fff6e2 86%,#efdcb6 100%); box-shadow: inset 12px 0 16px -10px rgba(107,68,38,0.4), 0 2px 0 #4a2c14, 2px 2px 0 #e8d2a6, 3px 4px 0 #d9bf92; }
.spine { position: absolute; left: 396px; top: 5px; width: 8px; height: 350px; border-radius: 4px; background: linear-gradient(90deg,#4a2c14,#8f5e36,#4a2c14); }
.pageHead { position: absolute; left: 13px; top: 6px; right: 12px; height: 22px; display: flex; align-items: baseline; gap: 7px; white-space: nowrap; overflow: hidden; }
.pageHead .cap { letter-spacing: 0.12em; }
.pageHead .ttl { font-family: var(--fred); font-weight: 700; font-size: 15px; color: #5b3418; }
.pageHead .sub { font-size: 10.5px; font-weight: 800; color: #8a6a4a; }
.grid { position: absolute; left: 10px; top: 30px; width: 368px; height: 282px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows: repeat(2, minmax(0,1fr)); gap: 7px; }
.card { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding: 6px; border-radius: 9px; background: linear-gradient(180deg,#fbefd2 0%,#f4e2bc 100%); border: 2px solid #d4b685; box-shadow: inset 0 2px 0 rgba(255,255,255,0.7), 0 2px 0 rgba(107,68,38,0.18); text-align: left; }
.card::before { content: ''; position: absolute; inset: 3px; border-radius: 6px; border: 1.5px dashed rgba(107,68,38,0.22); pointer-events: none; }
.card.sel { border-color: #e2b14a; box-shadow: 0 0 0 2px #6b4426, 0 0 14px rgba(226,177,74,0.9); }
.card .pic { position: relative; flex: 1; min-height: 0; margin-top: 8px; background-size: contain; background-position: center bottom; background-repeat: no-repeat; }
.card:hover .pic { filter: drop-shadow(0 0 6px rgba(226,177,74,0.95)); }
.tierTag { position: absolute; left: 7px; top: 6px; padding: 0 4px; border-radius: 4px; background: #c98d52; box-shadow: 0 0 0 1.5px #6b4426; font-family: var(--fred); font-weight: 700; font-size: 9.5px; line-height: 13px; color: #fff; }
.cnt { position: absolute; right: 6px; top: 5px; padding: 0 5px; border-radius: 4px; border: 2px solid #2f7a42; background: #fff6e2; font-family: var(--fred); font-weight: 700; font-size: 10px; line-height: 13px; color: #2f7a42; transform: rotate(8deg); }
.card .nm { position: relative; height: 23px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-family: var(--fred); font-weight: 700; font-size: 10px; line-height: 1.15; color: #5b3418; text-align: center; overflow: hidden; }
.card .pr { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--fred); font-weight: 700; font-size: 11.5px; color: #5b3418; }
.card .pr .btn { height: 20px; padding: 0 8px; font-size: 10px; letter-spacing: 0.04em; border-radius: 6px; }
.info { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border-radius: 9px; background: #e6f7ff; box-shadow: 0 0 0 1.5px #1e8fc4; }
.info .cap { color: #1e8fc4; }
.info .tx { font-family: var(--fred); font-weight: 600; font-size: 11px; line-height: 1.25; color: #16668f; }
.cats { position: absolute; left: 11px; top: 319px; display: flex; gap: 4px; }
.cats .btn { height: 21px; padding: 0 6px; font-size: 10.5px; border-radius: 6px; background: #fff6e2; }
.cats .btn.on { background: var(--brass); }
.det { position: absolute; left: 14px; top: 30px; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
.det .big { flex: none; height: 138px; border-radius: 10px; background: radial-gradient(ellipse at 50% 80%, #f8eedb, #ead7b2 80%); box-shadow: inset 0 2px 6px rgba(107,68,38,0.35), 0 0 0 2px #6b4426; display: flex; align-items: center; justify-content: center; }
.det .big div { width: 300px; height: 122px; background-size: contain; background-position: center; background-repeat: no-repeat; }
.det .row { display: flex; align-items: center; gap: 7px; }
.det .lvT { height: 20px; display: flex; align-items: center; padding: 0 9px; border-radius: 5px; border: 2px solid #6b4426; background: #c98d52; font-family: var(--fred); font-weight: 700; font-size: 11px; color: #fff6e2; text-shadow: 0 1px 0 #6b4426; white-space: nowrap; }
.det .name { font-family: var(--fred); font-weight: 700; font-size: 15px; line-height: 1.12; color: #5b3418; }
.det .room { font-size: 11px; font-weight: 800; color: #8a6a4a; }
.det .bonus { font-size: 12px; font-weight: 800; color: #2f7a42; }
.det .act { margin-top: auto; height: 34px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; font-size: 15px; border-width: 2.5px; box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.6), 0 3px 0 #6b4426; }

/* the unlock card (the house's detail card) */
.ucard { position: absolute; left: 50%; top: 50%; width: 420px; transform: translate(-50%,-50%) rotate(-0.6deg); display: flex; gap: 14px; padding: 14px; border-radius: 14px; background: #fff6e2; box-shadow: 0 0 0 2.5px #6b4426, 0 5px 0 2.5px #6b4426, 0 18px 36px rgba(30,15,5,0.45); animation: hsPop 0.18s ease-out both; }
.ucard::before { content: ''; position: absolute; inset: 5px; border-radius: 10px; border: 1.5px dashed rgba(107,68,38,0.28); pointer-events: none; }
.ucard .pic { flex: none; width: 150px; height: 150px; border-radius: 10px; background: radial-gradient(ellipse at 50% 70%, #4a2a6a, #1d1030 80%); box-shadow: inset 0 2px 6px rgba(0,0,0,0.45), 0 0 0 2px #6b4426; overflow: hidden; position: relative; }
.ucard .txt { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.ucard .h { font-family: var(--fred); font-weight: 700; font-size: 20px; line-height: 1.1; color: #5b3418; }
.ucard .b { font-size: 12px; font-weight: 700; line-height: 1.35; color: #7a5a3a; }
.ucard .act { margin-top: auto; height: 34px; font-size: 15px; border-width: 2.5px; box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.5), 0 3px 0 #6b4426; }
.ucard .x { position: absolute; right: -12px; top: -12px; width: 30px; height: 30px; }

/* ---- the soundboard stage */
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,6,32,0.32) 0%, rgba(20,6,32,0.12) 45%, rgba(20,6,32,0.22) 100%); pointer-events: none; }
.signGlow { position: absolute; width: 240px; height: 90px; margin: -45px 0 0 -120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(63,240,255,0.55), rgba(63,240,255,0)); mix-blend-mode: screen; opacity: 0.35; pointer-events: none; }
.beam { position: absolute; width: 90px; height: 330px; margin-left: -45px; transform-origin: 50% 0; pointer-events: none; transition: transform 1.6s cubic-bezier(.45,0,.55,1); }
.beam i { position: absolute; inset: 0; background: linear-gradient(180deg, var(--c) 0%, rgba(0,0,0,0) 88%); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); mix-blend-mode: screen; opacity: 0.3; filter: blur(2px); transition: opacity 0.4s; }
.lamp { position: absolute; width: 14px; height: 10px; margin: -5px 0 0 -7px; border-radius: 3px 3px 7px 7px; background: linear-gradient(180deg, #3a3350, #14121c); box-shadow: 0 0 0 1px #0c0c10, 0 4px 10px var(--c); }
.pool { position: absolute; width: 170px; height: 46px; margin: -23px 0 0 -85px; border-radius: 50%; background: radial-gradient(closest-side, var(--c), rgba(0,0,0,0)); mix-blend-mode: screen; opacity: 0.22; pointer-events: none; transition: left 0.5s ease, top 0.5s ease, opacity 0.3s; }
.spot { position: absolute; pointer-events: none; clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--c) 100%); mix-blend-mode: screen; opacity: 0.1; }
.spotFloor { position: absolute; width: 96px; height: 22px; margin: -11px 0 0 -48px; border-radius: 50%; background: radial-gradient(closest-side, var(--c), rgba(0,0,0,0)); mix-blend-mode: screen; opacity: 0.35; pointer-events: none; }
.selRing { position: absolute; width: 74px; height: 18px; margin: -9px 0 0 -37px; border-radius: 50%; border: 2.5px dashed #ffe14f; box-shadow: 0 0 10px rgba(255,225,79,0.8); pointer-events: none; animation: ring 6s linear infinite; }
@keyframes ring { to { filter: hue-rotate(0deg); } }
.tapTarget { cursor: pointer; }
.crowd .cr img { filter: brightness(0.78) saturate(0.95); }
.crowd .cr .hop { animation: idleSway 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes idleSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-1.5px); } }
#fxLayer, #fogLayer { position: absolute; inset: 0; pointer-events: none; }

  async function loadOne(name, src) {

    if (loading) return loading;

    comp.threshold.value = -10;
    comp.ratio.value = 4;
    audio.master = audio.ctx.createGain();
    audio.master.gain.value = 0.9;
    audio.master.connect(comp);
    comp.connect(audio.ctx.destination);
    const jobs = [];
    Object.entries(SND.voice).forEach(([k, s]) => jobs.push(loadOne(`v:${k}`, s)));
    Object.entries(SND.music).forEach(([k, s]) => jobs.push(loadOne(`m:${k}`, s)));
    Object.entries(SND.fx).forEach(([k, s]) => jobs.push(loadOne(`f:${k}`, s)));
    Object.entries(SND.ui).forEach(([k, s]) => jobs.push(loadOne(`u:${k}`, s)));
    loading = Promise.allSettled(jobs).then((r) => {
      audio.ready = true;
      audio.failed = r.every((x) => x.status === 'rejected');
      if (audio.failed) toast('No sound here. Open the bundled file, or serve this folder (npx serve).');

      h += `<div class="spotFloor" data-key="${p.key}" style="left:${p.x}px;top:${p.y - 2}px;--c:${COLOR[p.key]};z-index:221"></div>`;

  }
  let djEl = null;
  function putDj() {
    const host = $('djSq');

    if (!svg) { host.innerHTML = `<img alt="Mittens the DJ" src="${ART.sq[DJ_KEY]}" style="transform:scale(0.83)">`; djEl = null; return; }

  const perfOf = (key) => ST.perf.find((p) => p.key === key);

  // ---- fog: the design's club fog (art/club-fx.js) from the mist tower and the bass reactors while the music plays
  function fogAnchor(id, x, y, k, flip) {
    return () => {
      const el = $('fogLayer');

      const dir = id === 'CLB-090' ? [-0.94, 0.33] : [flip ? -0.94 : 0.94, 0.33];
      return { el, pts: PTS[id].map((p) => ({ x: x + p[0] * k * (flip ? -1 : 1), y: y + p[1] * k })), fl: { x, y }, dir, s: k * 1.2, cf: null };
    };

  function fogOn() {
    if (!window.ClubFog || RM) return;

  }
  function fogOff() { if (window.ClubFog) window.ClubFog.stopAll('sb:'); }

      setTimeout(() => window.ClubFog.stop(key), 500);

  // ---- the soundboard
  const B = { tab: 'voice', tool: { kind: 'voice', key: 'bubbly' }, playing: false, rec: false, step: -1, beat: 0.5 };
  function openBoard() {
    $('crib').hidden = true;
    $('board').hidden = false;
    if (!songsHere().some((s) => s.track === mix.track)) mix.track = songsHere()[0].track;
    renderMixer();
    renderPalette();
    updateSong();
    renderStage();
  }
  function closeBoard() {
    stop();
    roomFade(() => {
      $('board').hidden = true;
      $('crib').hidden = false;
      clearInterval(lightT);
      renderCrib();
    });
  }
  function updateSong() {
    const song = SONGS.find((s) => s.track === mix.track);
    const bpm = bpmOf(mix.track);
    $('songChip').innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12" stroke="#6b4426" stroke-width="2.8" fill="none"/><circle cx="6.5" cy="17.5" r="3.2" fill="#e2554a" stroke="#6b4426" stroke-width="1.5"/><circle cx="16.5" cy="15.5" r="3.2" fill="#3ff0ff" stroke="#6b4426" stroke-width="1.5"/></svg>${song.name}${bpm ? ` · ${bpm} BPM` : ''}`;
    $('mxSong').textContent = song.name;
    updatePos();
  }
  function updatePos() {
    const s = B.step;
    $('mxPos').textContent = B.playing && s >= 0 ? `Bar ${Math.floor(s / 4) + 1} · Beat ${(s % 4) + 1}` : `${bpmOf(mix.track) || '…'} BPM · 4 bars`;
  }

  function cellHtml(track, i) {
    const v = mix[track][i];
    let inner = i % 4 === 0 ? `<span class="n">${i / 4 + 1}</span>` : '';
    let c = '';
    if (v && track === 'voice') { inner += `<img alt="${SQ[v].name}" src="${ART.sq[v]}">`; c = COLOR[v]; }
    if (v && track === 'fx') { inner += `<span class="fx" style="--c:${FX_BY[v].color}">${FX_BY[v].short}</span>`; c = FX_BY[v].color; }
    return `<div class="cell${v ? ' filled' : ''}${i % 4 === 0 ? ' b1' : ''}" data-track="${track}" data-i="${i}" role="button" aria-label="${track} beat ${i + 1}${v ? `: ${track === 'voice' ? SQ[v].name : FX_BY[v].name}` : ''}"${c ? ` style="--c:${c}"` : ''}>${inner}</div>`;
  }
  function renderMixer() {
    $('vCells').innerHTML = mix.voice.map((_, i) => cellHtml('voice', i)).join('');
    $('fCells').innerHTML = mix.fx.map((_, i) => cellHtml('fx', i)).join('');
    $('mBars').innerHTML = mix.music.map((on, i) => `<div class="bar${on ? '' : ' off'}" data-bar="${i}" role="button" aria-pressed="${on}" aria-label="Bar ${i + 1}: ${on ? 'music' : 'break'}">${on ? '♪ Music' : 'Break'}</div>`).join('');
    markStep(B.step);
  }
  function refreshCell(track, i) {
    const host = track === 'voice' ? $('vCells') : $('fCells');
    host.querySelector(`.cell[data-i="${i}"]`).outerHTML = cellHtml(track, i);
    const el = host.querySelector(`.cell[data-i="${i}"]`);
    if (mix[track][i] && !RM) el.animate([{ transform: 'scale(0.5)' }, { transform: 'scale(1.15)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
    if (i === B.step) el.classList.add('now');
  }
  function markStep(i) {
    document.querySelectorAll('.cell.now, .bar.now').forEach((c) => c.classList.remove('now'));
    if (i < 0) return;
    document.querySelectorAll(`.cell[data-i="${i}"]`).forEach((c) => c.classList.add('now'));
    const bar = document.querySelector(`.bar[data-bar="${Math.floor(i / 4)}"]`);
    if (bar) bar.classList.add('now');
  }
  function renderPalette() {
    document.querySelectorAll('.laneTab').forEach((t) => {
      const on = t.dataset.tab === B.tab;
      t.classList.toggle('on', on);
      t.setAttribute('aria-pressed', on);
    });
    let h = '';
    const erase = `<button class="pal${B.tool.kind === 'erase' ? ' sel' : ''}" data-kind="erase"><span class="dot" style="--c:#fff6e2;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;color:#6b4426">✕</span>Erase</button>`;
    if (B.tab === 'voice') {
      h = VOICE_KEYS.map((k) => `<button class="pal${B.tool.kind === 'voice' && B.tool.key === k ? ' sel' : ''}" data-kind="voice" data-key="${k}"><img alt="" src="${ART.sq[k]}">${SQ[k].name}${k === DJ_KEY ? ' (DJ)' : ''}</button>`).join('') + erase;
    } else if (B.tab === 'fx') {
      h = FX.map((f) => `<button class="pal${B.tool.kind === 'fx' && B.tool.key === f.key ? ' sel' : ''}" data-kind="fx" data-key="${f.key}"><span class="dot" style="--c:${f.color}"></span>${f.name}</button>`).join('') + erase;
    } else {
      const n = songsHere().length;
      h = SONGS.map((s, i) => {
        if (i >= n) {
          const t = SONGS_AT.findIndex((m) => m > i);
          const need = ITEMS[CONSOLES[t]];
          return `<button class="song locked" data-need="${CONSOLES[t]}" aria-label="${s.name}: locked, Lv ${need.lv} console"><span class="lk">Lv ${need.lv}</span>${s.name}</button>`;
        }
        const bpm = bpmOf(s.track);
        return `<button class="song${s.track === mix.track ? ' sel' : ''}" data-track="${s.track}">${s.name}${bpm ? `<span class="bpm">${bpm}</span>` : ''}</button>`;
      }).join('');
    }
    $('palette').innerHTML = h;
    markSel();
  }

  // ---- editing
  function paintCell(track, i) {
    const t = B.tool;
    let v = mix[track][i];
    if (t.kind === 'erase') v = null;
    else if (t.kind !== track) { flashLane(track); return; } else v = v === t.key && !B.painting ? null : t.key;
    if (mix[track][i] === v) return;
    mix[track][i] = v;
    refreshCell(track, i);
    if (v && !B.playing) {
      wake().then(() => {
        if (track === 'voice') { playVoice(v, 0); stageVoice(v); } else { playFx(v, 0); stageFx(v); }
      });
    }
  }
  function flashLane(track) {
    const tab = document.querySelector(`.laneTab[data-tab="${track}"]`);
    tab.classList.remove('flashLane');
    void tab.offsetWidth;
    tab.classList.add('flashLane');
    toast(track === 'voice' ? 'Tap VOICE and pick a squishy first.' : 'Tap FX and pick a sound first.');
  }
  // tap or drag across cells to fill them
  let painting = null;
  ['vCells', 'fCells'].forEach((id) => {
    const host = $(id);
    host.addEventListener('pointerdown', (e) => {
      const c = e.target.closest('.cell');
      if (!c) return;
      e.preventDefault();
      const track = c.dataset.track;
      const i = Number(c.dataset.i);
      const before = mix[track][i];
      B.painting = false;
      paintCell(track, i);
      painting = { track, filled: !!mix[track][i] && mix[track][i] !== before };
      try { host.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    host.addEventListener('pointermove', (e) => {
      if (!painting || !painting.filled) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const c = el && el.closest && el.closest('.cell');
      if (!c || c.dataset.track !== painting.track) return;
      const i = Number(c.dataset.i);
      if (mix[painting.track][i] === B.tool.key) return;
      B.painting = true;
      paintCell(painting.track, i);
      B.painting = false;
    });
    const end = () => { if (painting) { painting = null; changed(); } };
    host.addEventListener('pointerup', end);
    host.addEventListener('pointercancel', end);
  });
  $('mBars').addEventListener('click', async (e) => {
    const b = e.target.closest('.bar');
    if (!b) return;
    await wake();
    const i = Number(b.dataset.bar);
    mix.music[i] = !mix.music[i];
    renderMixer();
    ui('tap', 0.5);
    changed();
  });
  document.querySelectorAll('.laneTab').forEach((t) => t.addEventListener('click', async () => {
    B.tab = t.dataset.tab;
    if (B.tab !== 'music' && B.tool.kind !== 'erase' && B.tool.kind !== B.tab) B.tool = B.tab === 'voice' ? { kind: 'voice', key: VOICE_KEYS[1] } : { kind: 'fx', key: FX[0].key };
    renderPalette();
    await wake();
    ui('tap', 0.4);
  }));
  $('palette').addEventListener('click', async (e) => {
    const p = e.target.closest('.pal, .song');
    if (!p) return;
    await wake();
    if (p.classList.contains('song')) {
      if (p.classList.contains('locked')) {
        ui('locked', 0.6);
        const need = ITEMS[p.dataset.need];
        toast(`A Lv ${need.lv} DJ Console brings this song. Find it in the Catalog.`);
        return;
      }
      mix.track = p.dataset.track;
      renderPalette();
      updateSong();
      changed();
      if (B.playing) { stop(); play(); } else ui('select', 0.5);
      return;
    }
    const kind = p.dataset.kind;
    B.tool = kind === 'erase' ? { kind: 'erase' } : { kind, key: p.dataset.key };
    renderPalette();
    if (kind === 'voice') { playVoice(p.dataset.key, 0); stageVoice(p.dataset.key); }
    if (kind === 'fx') { playFx(p.dataset.key, 0); stageFx(p.dataset.key); }
    if (kind === 'erase') ui('tap', 0.4);
  });
  function changed() { $('save').textContent = 'Save'; }

  // ---- playing: a look-ahead scheduler on the audio clock
  let timer = 0;
  let raf = 0;
  const queue = [];
  const MUSIC_LEVEL = 0.55;
  async function play() {
    await wake();
    await loading;
    if (audio.failed) return;
    const buf = audio.bufs[`m:${mix.track}`];
    B.beat = buf.duration / 32;
    const ctx = audio.ctx;
    B.t0 = ctx.currentTime + 0.12;
    B.musicGain = ctx.createGain();
    B.musicGain.gain.value = mix.music[0] ? MUSIC_LEVEL : 0.0001;
    B.musicGain.connect(audio.master);
    B.music = ctx.createBufferSource();
    B.music.buffer = buf;
    B.music.loop = true;
    B.music.connect(B.musicGain);
    B.music.start(B.t0);
    B.nextStep = 0;
    B.nextTime = B.t0;
    B.playing = true;
    $('play').innerHTML = STOP_SVG;
    $('play').classList.add('on');
    $('play').setAttribute('aria-label', 'Stop');
    putDj();
    fogOn();
    timer = setInterval(tick, 25);
    tick();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (!B.playing) return;
    B.playing = false;
    clearInterval(timer);
    cancelAnimationFrame(raf);
    queue.length = 0;
    try {
      const t = audio.ctx.currentTime;
      B.musicGain.gain.cancelScheduledValues(t);
      B.musicGain.gain.setTargetAtTime(0.0001, t, 0.05);
      B.music.stop(t + 0.3);
    } catch (e) { /* ignore */ }
    B.step = -1;
    markStep(-1);
    updatePos();
    $('play').innerHTML = PLAY_SVG;
    $('play').classList.remove('on');
    $('play').setAttribute('aria-label', 'Play');
    if (djEl) { try { djEl.pauseAnimations(); djEl.setCurrentTime(0); } catch (e) { /* ignore */ } }
    fogOff();
    idleLights();
  }
  function tick() {
    const ctx = audio.ctx;
    while (B.nextTime < ctx.currentTime + 0.15) {
      const i = B.nextStep;
      const t = B.nextTime;
      const v = mix.voice[i];
      const f = mix.fx[i];
      // each bar's music on or off (a BREAK bar), set as its first beat is scheduled
      if (i % 4 === 0) B.musicGain.gain.setTargetAtTime(mix.music[i / 4] ? MUSIC_LEVEL : 0.0001, t - 0.01, 0.012);
      if (v) playVoice(v, t);
      if (f) playFx(f, t);
      queue.push({ t, i, v, f });
      B.nextStep = (i + 1) % STEPS;
      B.nextTime += B.beat;
    }
  }
  function frame() {
    if (!B.playing) return;
    const now = audio.ctx.currentTime;
    while (queue.length && queue[0].t <= now + 0.01) {
      const ev = queue.shift();
      B.step = ev.i;
      markStep(ev.i);
      updatePos();
      onBeat(ev.i, ev.t);
      if (ev.v) stageVoice(ev.v);
      if (ev.f) stageFx(ev.f);
    }
    raf = requestAnimationFrame(frame);
  }

  // ---- the stage's reactions
  function onBeat(i, t) {
    const on = mix.music[Math.floor(i / 4)];
    // the DJ's groove follows the song: back in step at every bar
    if (djEl && i % 4 === 0) {
      try {
        djEl.setCurrentTime(((t - B.t0) % (B.beat * 8) + B.beat * 8) % (B.beat * 8));
        if (on) djEl.unpauseAnimations(); else djEl.pauseAnimations();
      } catch (e) { /* ignore */ }
    }
    if (RM) return;
    if (on) {
      moveLights(true);
      const g = $('signGlow');
      if (g) g.animate([{ opacity: 0.85 }, { opacity: 0.3 }], { duration: B.beat * 1000, easing: 'ease-out' });
      const d = B.beat * 1000 * 0.9;
      $('stage').querySelectorAll('.perf .hop').forEach((h, k) => h.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-5 - (k % 2) * 3}px)` }, { transform: 'translateY(0)' }], { duration: d, easing: 'ease-out' }));
      $('stage').querySelectorAll('.crowd .sq').forEach((h, k) => {
        if ((k + i) % 2) return;
        h.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-rnd(4, 9)}px)` }, { transform: 'translateY(0)' }], { duration: d, delay: rnd(0, 40), easing: 'ease-out' });
      });
    }
  }
  function stageVoice(key) {
    const el = sqEl(key);
    if (!el) return;
    if (!RM) el.querySelector('.sq').animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.18,0.78)', offset: 0.25 }, { transform: 'scale(0.94,1.1)', offset: 0.6 }, { transform: 'scale(1,1)' }], { duration: 380, easing: 'ease-out' });
    const spot = $('stage').querySelector(`.spot[data-key="${key}"]`);
    if (spot) spot.animate([{ opacity: 0.6 }, { opacity: 0.1 }], { duration: 650, easing: 'ease-out' });
    const fl = $('stage').querySelector(`.spotFloor[data-key="${key}"]`);
    if (fl) fl.animate([{ opacity: 1, transform: 'scale(1.3)' }, { opacity: 0.35, transform: 'scale(1)' }], { duration: 650, easing: 'ease-out' });
    if (RM) return;
    const p = sqPoint(key);
    const n = document.createElement('div');
    n.className = 'note8';
    n.textContent = Math.random() < 0.5 ? '♪' : '♫';
    n.style.setProperty('--c', COLOR[key]);
    $('fxLayer').appendChild(n);
    const dx = rnd(-15, 15);
    n.animate([{ transform: `translate(${p.x}px,${p.y}px) scale(0.6)`, opacity: 0 }, { transform: `translate(${p.x + dx * 0.4}px,${p.y - 26}px) scale(1.1)`, opacity: 1, offset: 0.3 }, { transform: `translate(${p.x + dx}px,${p.y - 70}px) scale(0.9)`, opacity: 0 }], { duration: 900, easing: 'ease-out' }).finished.then(() => n.remove());
  }
  function burst(x, y, colors, n = 10, dist = 40, star = false) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-0.3, 0.3);
      const d = rnd(dist * 0.6, dist);
      const s = rnd(5, 10);
      const p = document.createElement('div');
      p.className = 'part';
      p.style.cssText = `width:${s}px;height:${s}px;margin:${-s / 2}px 0 0 ${-s / 2}px;background:${colors[i % colors.length]};box-shadow:0 0 6px ${colors[i % colors.length]};${star ? `border-radius:${s * 0.18}px;` : ''}`;
      $('fxLayer').appendChild(p);
      const r = star ? 45 : 0;
      p.animate([{ transform: `translate(${x}px,${y}px) rotate(${r}deg) scale(0.3)`, opacity: 1 }, { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d + 10}px) rotate(${r}deg) scale(1)`, opacity: 0 }], { duration: 560, easing: 'ease-out' }).finished.then(() => p.remove());
    }
  }
  function stageFx(key) {
    if ($('board').hidden || !$('fxLayer')) return;
    const who = pickOne(ST.perf).key;
    const p = sqPoint(who);
    if (RM) return;
    if (key === 'pop') burst(p.x, p.y, ['#ff8fd0', '#ffffff', '#ffe066', '#9ce8ff'], 10, 44);
    else if (key === 'sparkle') for (let k = 0; k < 3; k++) burst(rnd(150, 700), rnd(60, 200), ['#fff3a0', '#ffffff', '#ffd1f5', '#c9f5ff'], 6, 30, true);
    else if (key === 'coin') burst(ST.console.x, ST.console.y - 70, ['#ffd23a', '#fff3a0', '#ffffff'], 14, 70, true);
    else if (key === 'bubble') {
      // from the mist tower's bubble cloud
      for (let k = 0; k < 7; k++) {
        const b = document.createElement('div');
        b.className = 'bubbleFx';
        const s = rnd(12, 24);
        const x0 = rnd(560, 840);
        b.style.cssText = `width:${s}px;height:${s}px;left:${x0}px;top:${rnd(150, 230)}px`;
        $('fxLayer').appendChild(b);
        b.animate([{ transform: 'translateY(0) scale(0.5)', opacity: 0 }, { transform: `translate(${rnd(-60, -20)}px, -50px) scale(1)`, opacity: 1, offset: 0.3 }, { transform: `translate(${rnd(-160, -60)}px, -150px) scale(1.1)`, opacity: 0 }], { duration: 1500 + k * 90, easing: 'ease-out' }).finished.then(() => b.remove());
      }
    } else if (key === 'boing') {
      $('stage').querySelectorAll('.perf .sq, #djSq, .crowd .sq').forEach((s, k) => s.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-18px) scale(0.95,1.08)', offset: 0.4 }, { transform: 'translateY(0) scale(1.08,0.92)', offset: 0.8 }, { transform: 'translateY(0)' }], { duration: 460, delay: (k % 6) * 25, easing: 'ease-out' }));
    } else if (key === 'squeak') {
      sqEl(who).querySelector('.sq').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg) scale(1.05)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(0)' }], { duration: 360 });
    } else if (key === 'bonk') {
      $('stage').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 300 });
    } else if (key === 'whoosh') {
      const s = document.createElement('div');
      s.className = 'sweep';
      $('fxLayer').appendChild(s);
      s.animate([{ transform: 'translateX(-200px) skewX(-18deg)' }, { transform: 'translateX(1000px) skewX(-18deg)' }], { duration: 520, easing: 'ease-in-out' }).finished.then(() => s.remove());
      fogBurst();
    }
  }
  // a tap on a voice on stage: it sings now, and with REC on, it's written onto the nearest beat
  async function liveVoice(key) {
    await wake();
    playVoice(key, 0);
    stageVoice(key);
    if (B.rec && B.playing) {
      const i = ((Math.round((audio.ctx.currentTime - B.t0) / B.beat) % STEPS) + STEPS) % STEPS;
      mix.voice[i] = key;
      refreshCell('voice', i);
      changed();
    }
  }
  // the crowd: a squish and a hop (they cheer; they're not on the mixer)
  async function crowdVoice(el) {
    await wake();
    playVoice(el.dataset.key, 0);
    if (!RM) el.querySelector('.sq').animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-14px) scale(0.95,1.06)', offset: 0.4 }, { transform: 'translateY(0) scale(1.08,0.92)', offset: 0.8 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
  }

  // ---- transport
  $('play').addEventListener('click', () => { if (B.playing) stop(); else play(); });
  $('clear').addEventListener('click', async () => {
    await wake();
    ui('tap', 0.5);
    mix.voice = mix.voice.map(() => null);
    mix.fx = mix.fx.map(() => null);
    mix.music = [true, true, true, true];
    renderMixer();
    changed();
  });
  $('mixIt').addEventListener('click', async () => {
    await wake();
    ui('select', 0.5);
    // a fresh groove: voices on the beats in pairs, effects on the off-beats, sometimes a break
    const pair = [pickOne(VOICE_KEYS), pickOne(VOICE_KEYS)];
    mix.voice = mix.voice.map((_, i) => (i % 2 === 0 && Math.random() < 0.8 ? pair[(i / 2) % 2] : i % 4 === 3 && Math.random() < 0.3 ? pickOne(VOICE_KEYS) : null));
    const pool = FX.map((f) => f.key);
    const main = pickOne(pool);
    mix.fx = mix.fx.map((_, i) => (i % 2 === 1 && Math.random() < 0.6 ? (Math.random() < 0.6 ? main : pickOne(pool)) : null));
    mix.music = [true, true, Math.random() < 0.6, true];
    renderMixer();
    changed();
  });
  $('rec').addEventListener('click', async () => {
    await wake();
    B.rec = !B.rec;
    $('rec').classList.toggle('on', B.rec);
    $('rec').setAttribute('aria-pressed', B.rec);
    ui('tap', 0.5);
    if (B.rec) toast('Recording: press Play, then tap the DJ and the dancers. Each tap lands on the beat.');
  });
  $('save').addEventListener('click', async () => {
    await wake();
    save.mix = clone(mix);
    store();
    ui('save', 0.6);
    $('save').textContent = 'Saved ✓';
    toast("Mix saved. It'll be here the next time you open the Soundboard.");
  });
  $('boardBack').addEventListener('click', async () => { await wake(); ui('tap', 0.5); closeBoard(); });
  window.addEventListener('keydown', (e) => {
    if ($('board').hidden || !$('overlay').hidden) return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  });

  // ---- toast and the room change
  let toastT = 0;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.hidden = false;
    if (!RM) t.animate([{ transform: 'translate(-50%,-14px) rotate(-1.2deg)', opacity: 0 }, { transform: 'translate(-50%,0) rotate(-1.2deg)', opacity: 1 }], { duration: 220, easing: 'ease-out' });
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 3200);
  }
  async function roomFade(change) {
    ui('room', 0.5);
    if (RM) { change(); return; }
    const f = $('fade');
    await f.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' }).finished;
    change();
    await wait(60);
    await f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).finished;
  }

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
  fontsReady.then(() => {
    renderCrib();
    loadAll(); // decoding can start before the first tap; playing waits for it
  });
  window.Soundboard = { B, mix: () => mix, save: () => save, audio, tryOpen, openCatalog, place, play, stop, openBoard };
})();
</script>
