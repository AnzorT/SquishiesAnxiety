<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squish Soundboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Squish Soundboard: the Crib's DJ booth as a music toy. Two screens: the
   Crib's Dance Room, where the equipped DJ booth (src/crib catalogue, via
   djart.js) opens the soundboard from the DJ Deck up; and the soundboard,
   a stage (the dance room, its light-up floor from src/crib/Dance.js, the
   booth, five squishies) over a mixer in the dance room's song-pill plum
   (src/crib/ui.js SongPill) with three tracks: VOICE (each squishy's own
   squish recording), FX (the app's sounds) and MUSIC (the DJ's songs, the
   Crib's club tracks). Buttons are the Crib's sticker and plain buttons;
   the top bar is the Crib's HUD (src/crib/Hud.js). One look: no dark mode. */
:root {
  --ink: #5b3a29;          /* the Crib's ink (crib/ui.js INK) */
  --paper: #fff8ee;        /* crib/ui.js PAPER */
  --soft: #8a6a50;         /* crib/ui.js SOFT */
  --plum: rgba(42,20,48,0.92); /* the song pill */
  --plum-solid: #2a1430;
  --night: #140818;        /* the dance floor's lines */
  --glass: rgba(91,58,41,0.75);
  --white: #ffffff;
  --pink: #ff5cc6;
  --mint: #5cf2c8;
  --gold: #ffd23a;
  --lilac: #c9b6f0;        /* the song pill's count */
  --plum-ink: #45107a;
  --display: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden; background: #3b2030; color: var(--white);
  font-family: var(--body); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
img { -webkit-user-drag: none; }

.screen { position: fixed; inset: 0; }
.col {
  position: relative; height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 8px;
}

/* ---- the Crib's top bar */
.top { position: relative; z-index: 20; display: flex; align-items: center; gap: 8px; }
.cribBtn { position: relative; width: 50px; height: 54px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.cribBtn .cc { position: absolute; left: 0; width: 50px; height: 50px; border-radius: 50%; background: var(--ink); }
.cribBtn .cc1 { top: 4px; }
.cribBtn .cc0 { top: 0; }
.cribBtn .cface { position: absolute; left: 2px; top: 2px; width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--white); overflow: hidden; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #ffd0f0 0%, #ff7fd0 55%, #d84aa8 100%); }
.cribBtn:active .cc0, .cribBtn:active .cface { transform: translateY(3px); }
.titleBox { flex: 1; min-width: 0; }
.roomTitle { display: block; overflow: visible; max-width: 100%; }
.roomSub { margin-top: -2px; font: 900 11px/1.3 var(--body); letter-spacing: 0.6px; color: var(--white); text-shadow: 0 1px 1.5px var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--glass); border: 2px solid rgba(255,255,255,0.9); flex: none; font: 900 11px/1.2 var(--body); letter-spacing: 0.6px; color: var(--white); font-variant-numeric: tabular-nums; }

/* ---- the dance room scene (852 x 393 scene units, scaled) */
.sceneBox { position: relative; overflow: hidden; }
.scene { position: absolute; left: 0; top: 0; width: 852px; height: 393px; transform-origin: 0 0; }
.scene > img.room { position: absolute; left: 0; top: 0; width: 852px; height: 393px; }
.booth { position: absolute; }
.booth svg { display: block; width: 100%; height: 100%; }
.floor { position: absolute; border-radius: 24px; background: var(--night); border: 3px solid #2a1430; overflow: hidden; box-shadow: 0 0 0 6px rgba(255,92,198,0.3); }
.floor .ft { position: absolute; width: 56px; height: 56px; }
.floor .glow { position: absolute; inset: 0; background: #ffffff; opacity: 0.05; }
.sq { position: absolute; transform-origin: 50% 100%; cursor: pointer; }
.sq .shadow { position: absolute; left: 14%; right: 14%; bottom: -4%; height: 13%; border-radius: 50%; background: rgba(255,255,255,0.28); }
.sq .hop, .sq .squash { position: absolute; inset: 0; transform-origin: 50% 100%; }
.sq img { position: absolute; inset: 0; width: 100%; height: 100%; }
.sq .ring { position: absolute; left: 50%; top: 50%; width: 120%; padding-top: 120%; border-radius: 50%; border: 4px solid var(--c); transform: translate(-50%, -50%) scale(0.4); opacity: 0; pointer-events: none; }
.fxLayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.part { position: absolute; left: 0; top: 0; border-radius: 50%; }
.note { position: absolute; left: 0; top: 0; font: 700 22px/1 var(--display); color: var(--white); text-shadow: 0 2px 0 var(--c), 1px 0 0 var(--c), -1px 0 0 var(--c); }
.bubbleFx { position: absolute; border-radius: 50%; border: 2px solid #ffffff; background: radial-gradient(circle at 34% 30%, #ffffff 0 12%, rgba(255,255,255,0.6) 15%, rgba(150,214,255,0.55) 42%, rgba(200,170,255,0.6) 72%, rgba(255,170,225,0.75) 100%); }
.sweep { position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.45), rgba(255,255,255,0)); }

/* ---- Crib screen */
#crib .sceneBox { position: absolute; left: 0; right: 0; top: 0; }
#crib .col { justify-content: space-between; }
.boothTag { position: absolute; z-index: 15; transform: translate(-50%, -100%); }
.panel { position: relative; z-index: 20; border-radius: 22px; background: var(--glass); border: 2px solid rgba(255,255,255,0.9); padding: 10px; }
.panelHead { font: 900 11px/1.3 var(--body); letter-spacing: 0.8px; color: #ffe6b8; margin: 0 2px 8px; }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tierCard { position: relative; border: 2.5px solid rgba(255,255,255,0.5); border-radius: 16px; background: var(--paper); color: var(--ink); padding: 6px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.tierCard.on { border-color: var(--white); box-shadow: 0 0 0 3px var(--pink); }
.tierCard .ti { width: 100%; height: 32px; display: flex; align-items: center; justify-content: center; }
.tierCard .ti svg { width: 92%; height: 32px; }
.tierCard .tn { font: 700 12px/1.15 var(--display); }
.tierCard .tp { font: 800 9.5px/1.2 var(--body); color: var(--soft); }
.tierCard .ts { font: 800 9.5px/1.2 var(--body); color: #16a86a; }
.tierCard .ts.no { color: #b07a5a; }
.tierCard .onTag { position: absolute; top: -8px; right: -6px; padding: 1px 7px; border-radius: 999px; background: var(--pink); border: 2px solid var(--white); font: 700 9.5px/1.4 var(--display); color: var(--white); }

/* Crib sticker / plain buttons (crib/ui.js) */
.sticker { position: relative; display: inline-block; padding: 0 0 3px; border: 0; background: none; cursor: pointer; vertical-align: top; }
.sticker .slip { position: absolute; left: 0; right: 0; top: 3px; bottom: 0; border-radius: 999px; background: var(--r); }
.sticker .sring { position: relative; display: block; border-radius: 999px; padding: 2px; background: var(--r); }
.sticker .sface { display: block; border-radius: 999px; border: 2.5px solid var(--white); padding: 8px 16px; background: linear-gradient(180deg, var(--c0) 0%, var(--c1) 45%, var(--c2) 100%); font: 700 14px/1.15 var(--display); letter-spacing: 0.5px; color: var(--white); text-shadow: 0 1.5px 1px var(--r); white-space: nowrap; text-align: center; }
.sticker.small .sface { padding: 5px 12px; font-size: 12px; }
.sticker:active:not(:disabled) .sring { transform: translateY(2px); }
.sticker:disabled { opacity: 0.5; cursor: default; }
.st-gold { --r: #a04a00; --c0: #fffbd6; --c1: #ffe045; --c2: #ff9500; }
.st-pink { --r: #8a1f6a; --c0: #ffd0f0; --c1: #ff7fd0; --c2: #d84aa8; }
.st-green { --r: #2e6b2a; --c0: #c9e8a8; --c1: #8fc46e; --c2: #5f9a4a; }
.st-red { --r: #8e1580; --c0: #ffab98; --c1: #f2665a; --c2: #d9483e; }
.st-purple { --r: #6a3a8a; --c0: #e9d6ff; --c1: #b38cff; --c2: #8a5fd6; }
.st-grey { --r: #5a4a6a; --c0: #e6dcf0; --c1: #b9a6cc; --c2: #8f7bb8; }
.plain { border-radius: 999px; border: 2.5px solid var(--ink); background: var(--paper); padding: 7px 14px; font: 700 13px/1.15 var(--display); color: var(--ink); cursor: pointer; white-space: nowrap; }
.plain:active { opacity: 0.7; }

/* ---- soundboard screen */
#board .stage { flex: 1 1 auto; min-height: 190px; margin: 6px -16px 0; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
#board .stage .wallFill { position: absolute; left: 0; right: 0; top: 0; background: #61245d; }
.mixer { position: relative; z-index: 10; margin-top: -14px; border-radius: 22px; background: var(--plum); border: 2.5px solid var(--white); padding: 8px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.track { display: flex; gap: 6px; align-items: stretch; }
.tlabel { width: 38px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,0.08); font: 700 10px/1 var(--display); letter-spacing: 0.8px; color: var(--lilac); writing-mode: vertical-rl; transform: rotate(180deg); }
.cells { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.cell { position: relative; aspect-ratio: 1 / 0.92; border-radius: 9px; background: rgba(255,255,255,0.07); border: 1.5px dashed rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: visible; }
.cell.down1 { background: rgba(255,255,255,0.12); }
.cell .n { position: absolute; left: 3px; top: 1px; font: 700 7.5px/1 var(--display); color: rgba(255,255,255,0.35); }
.cell.filled { border-style: solid; border-color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.1); }
.cell img { width: 86%; height: 86%; object-fit: contain; border-radius: 50%; background: #f6efff; border: 1.5px solid #fff; }
.cell .chip { width: 90%; height: 76%; border-radius: 8px; background: var(--c); display: flex; align-items: center; justify-content: center; font: 700 9px/1 var(--display); color: var(--white); text-shadow: 0 1px 0 rgba(42,20,48,0.6); letter-spacing: 0.2px; }
.cell.now, .bar.now { box-shadow: 0 0 0 2px var(--pink), 0 0 12px rgba(255,92,198,0.9); }
.bars { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.bar { height: 26px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font: 700 10.5px/1 var(--display); letter-spacing: 0.4px; color: var(--white); background: linear-gradient(90deg, rgba(255,92,198,0.55), rgba(92,242,200,0.45)); }
.bar.off { background: rgba(255,255,255,0.06); border-style: dashed; border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.45); }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; border-radius: 999px; border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); padding: 5px 0; font: 700 11.5px/1.2 var(--display); letter-spacing: 0.6px; color: var(--lilac); cursor: pointer; }
.tab.on { background: linear-gradient(180deg, #ffd0f0 0%, #ff7fd0 55%, #d84aa8 100%); border-color: var(--white); color: var(--white); text-shadow: 0 1.5px 1px #8a1f6a; }
.palette { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; min-height: 66px; scrollbar-width: none; }
.palette::-webkit-scrollbar { display: none; }
.pal { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; padding: 0; cursor: pointer; width: 52px; }
.pal .pi { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid #ffffff; background: #f6efff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pal .pi img { width: 92%; height: 92%; object-fit: contain; }
.pal .pi.fx { background: var(--c); font: 700 10px/1 var(--display); color: var(--white); text-shadow: 0 1px 0 rgba(42,20,48,0.6); }
.pal .pn { font: 800 9.5px/1.1 var(--body); color: var(--lilac); white-space: nowrap; }
.pal.sel .pi { box-shadow: 0 0 0 3px var(--pink), 0 0 12px rgba(255,92,198,0.8); }
.pal.sel .pn { color: var(--white); }
.song { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 9px; border-radius: 999px; border: 2.5px solid #ffffff; background: rgba(42,20,48,0.85); cursor: pointer; align-self: center; }
.song .sn { font: 700 13px/1.1 var(--display); color: var(--white); white-space: nowrap; }
.song .sb { font: 700 11px/1 var(--display); color: var(--lilac); white-space: nowrap; }
.song.sel { box-shadow: 0 0 0 3px var(--pink), 0 0 12px rgba(255,92,198,0.8); }
.song.locked { opacity: 0.55; border-style: dashed; }
.transport { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.transport .sticker { flex: 1; }
.transport .sticker .sface { padding: 9px 4px; font-size: 13px; }
.transport .play .sface { font-size: 15px; }
.rec { flex: none; width: 46px; height: 40px; border-radius: 999px; border: 2.5px solid var(--white); background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font: 700 10px/1 var(--display); color: var(--lilac); }
.rec .dot { width: 11px; height: 11px; border-radius: 50%; background: #8f7bb8; }
.rec.on { background: rgba(242,102,90,0.25); color: var(--white); }
.rec.on .dot { background: #f2665a; box-shadow: 0 0 8px #f2665a; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

/* ---- the Crib's toast (crib/ui.js CribToast) and the shared cards */
.toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top, 0px)); z-index: 60; width: min(420px, calc(100% - 32px)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 18px; background: var(--paper); border: 3px solid var(--white); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
.toast .tt { font: 700 14px/1.2 var(--display); color: var(--ink); }
.toast .tb { font: 700 12px/1.3 var(--body); color: var(--soft); }
#overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); }
#overlay .tint { position: absolute; inset: 0; background: rgba(40,8,80,0.55); animation: fadeIn 220ms ease-out both; }
#overlay .card { position: relative; width: 100%; max-width: 360px; border-radius: 30px; background: #45189a; padding: 3px 3px 8px; animation: cardIn 420ms cubic-bezier(0.3, 1.5, 0.55, 1) both; }
#overlay .cardRim { border-radius: 27px; background: var(--white); padding: 3px; }
#overlay .cardFill { border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(180deg, #fff6fd 0%, #ffe3f6 55%, #efd8ff 100%); color: var(--plum-ink); text-align: center; }
.cardBody { font: 800 14px/1.4 var(--body); color: var(--plum-ink); }
.cardSub { font: 700 12px/1.35 var(--display); letter-spacing: 0.6px; color: #8a5fc0; }
.cardBooth { width: 70%; }
.cardBooth svg { width: 100%; height: auto; display: block; }
.btnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(120px) scale(0.7); } 30% { opacity: 1; } }
.ot { display: block; overflow: visible; }
#flash { position: fixed; inset: 0; z-index: 70; pointer-events: none; opacity: 0; }
#flash img { position: absolute; inset: 0; width: 100%; height: 100%; }
#flash .dots { position: absolute; inset: 0; background-size: 22px 22px; }
.loading { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 30; padding: 8px 14px; border-radius: 999px; background: rgba(42,20,48,0.85); border: 2.5px solid #fff; font: 700 13px/1.2 var(--display); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .rec.on .dot { animation: none; }
}
</style>
</head>
<body>

<!-- the Crib's Dance Room: the DJ booth opens the soundboard -->
<div class="screen" id="crib">
  <div class="sceneBox" id="cribScene"></div>
  <div class="col">
    <header class="top">
      <button class="cribBtn" id="cribBack" aria-label="Back" disabled><span class="cc cc1"></span><span class="cc cc0"></span><span class="cface"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" transform="translate(0 1.5)" stroke="#8a1f6a" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 4 L7 12 L15 20" stroke="#ffffff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <div class="titleBox"><div id="cribTitle"></div><div class="roomSub">YOUR CRIB · TAP THE DJ BOOTH</div></div>
    </header>
    <section class="panel" id="tierPanel">
      <div class="panelHead">PROTOTYPE · PUT ON A DJ BOOTH (IN THE APP: BUY IT IN THE HOME SHOP)</div>
      <div class="tiers" id="tiers"></div>
    </section>
  </div>
</div>

<!-- the soundboard -->
<div class="screen" id="board" hidden>
  <div class="col">
    <header class="top">
      <button class="cribBtn" id="boardBack" aria-label="Back to the Crib"><span class="cc cc1"></span><span class="cc cc0"></span><span class="cface"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" transform="translate(0 1.5)" stroke="#8a1f6a" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 4 L7 12 L15 20" stroke="#ffffff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <div class="titleBox"><div id="boardTitle"></div><div class="roomSub" id="boardSub"></div></div>
      <div class="pill" id="bpm">118 BPM</div>
    </header>
    <div class="sceneBox stage" id="stage"><div class="wallFill" id="wallFill"></div></div>
    <section class="mixer" id="mixer">
      <div class="track"><div class="tlabel">VOICE</div><div class="cells" id="vCells"></div></div>
      <div class="track"><div class="tlabel">FX</div><div class="cells" id="fCells"></div></div>
      <div class="track"><div class="tlabel">MUSIC</div><div class="bars" id="mBars"></div></div>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="voice">VOICES</button>
        <button class="tab" data-tab="fx">FX</button>
        <button class="tab" data-tab="music">MUSIC</button>
      </div>
      <div class="palette" id="palette"></div>
      <div class="transport">
        <button class="sticker st-green play" id="play"><span class="slip"></span><span class="sring"><span class="sface" id="playLabel">▶ PLAY</span></span></button>
        <button class="plain" id="clear">CLEAR</button>
        <button class="sticker st-purple" id="mixIt"><span class="slip"></span><span class="sring"><span class="sface">MIX IT!</span></span></button>
        <button class="rec" id="rec" aria-pressed="false"><span class="dot"></span>REC</button>
        <button class="sticker st-gold" id="save"><span class="slip"></span><span class="sring"><span class="sface">SAVE</span></span></button>
      </div>
    </section>
  </div>
</div>

<div id="flash"><img alt="" src="../../assets/crib/flash-glow.png"><div class="dots" id="flashDots"></div></div>
<div id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="djart.js"></script>
<script src="voices.js"></script>
<script>
(function () {
  'use strict';
  const DJ = window.DJ;
  const VOICES = window.VOICES;

  // ---- the repository's own art and sounds (literal paths, so
  // tools/bundle.mjs can inline them)
  const A = {
    room: { base: '../../assets/crib/rooms/dance-base.webp', over: '../../assets/crib/rooms/dance-over-day.webp' },
    flashDots: '../../assets/crib/flash-dots.png',
    body: {
      bubbly: '../../assets/stack/bubbly.webp', mittens: '../../assets/stack/mittens.webp', pip: '../../assets/stack/pip.webp',
      frybo: '../../assets/stack/frybo.webp', twinkle: '../../assets/stack/twinkle.webp',
    },
    head: {
      bubbly: '../../assets/squishdoku/heads/bubbly-happy.webp', mittens: '../../assets/squishdoku/heads/mittens-happy.webp', pip: '../../assets/squishdoku/heads/pip-happy.webp',
      frybo: '../../assets/squishdoku/heads/frybo-happy.webp', twinkle: '../../assets/squishdoku/heads/twinkle-happy.webp',
    },
    // each creature's own squish recording (src/audio/creatureSquishFiles.js: id -> file)
    voice: {
      bubbly: '../../assets/audio/creatures/18.ogg', mittens: '../../assets/audio/creatures/1.ogg', pip: '../../assets/audio/creatures/6.ogg',

  function hueRotate(hex, deg) { // src/crib/Dance.js, CSS's hue-rotate()
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    const a = (deg * Math.PI) / 180;
    const c = Math.cos(a);
    const s = Math.sin(a);
    const m = [
      [0.213 + c * 0.787 - s * 0.213, 0.715 - c * 0.715 - s * 0.715, 0.072 - c * 0.072 + s * 0.928],
      [0.213 - c * 0.213 + s * 0.143, 0.715 + c * 0.285 + s * 0.14, 0.072 - c * 0.072 - s * 0.283],

  }
  function refreshCell(track, i) {
    const host = track === 'voice' ? $('vCells') : $('fCells');
    const old = host.querySelector(`.cell[data-i="${i}"]`);
    old.outerHTML = cellHtml(track, i);
    const el = host.querySelector(`.cell[data-i="${i}"]`);
    if (mix[track][i]) el.animate([{ transform: 'scale(0.5)' }, { transform: 'scale(1.15)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
    if (i === B.step) el.classList.add('now');
  }
  function markStep(i) {
    document.querySelectorAll('.cell.now, .bar.now').forEach((c) => c.classList.remove('now'));
    if (i < 0) return;
    document.querySelectorAll(`.cell[data-i="${i}"]`).forEach((c) => c.classList.add('now'));
    const bar = document.querySelector(`.bar[data-bar="${Math.floor(i / 4)}"]`);
    if (bar) bar.classList.add('now');
  }

  function renderPalette() {
    document.querySelectorAll('.tab').forEach((t) => {
      const on = t.dataset.tab === B.tab;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on);
    });
    let html = '';
    if (B.tab === 'voice') {
      html = LINEUP.map((s) => `<button class="pal${B.tool.kind === 'voice' && B.tool.key === s.key ? ' sel' : ''}" data-kind="voice" data-key="${s.key}"><span class="pi"><img alt="" src="${A.head[s.key]}"></span><span class="pn">${s.name}</span></button>`).join('');
      html += `<button class="pal${B.tool.kind === 'erase' ? ' sel' : ''}" data-kind="erase"><span class="pi fx" style="--c:#5a4a6a">✕</span><span class="pn">Erase</span></button>`;
    } else if (B.tab === 'fx') {
      html = FX.map((f) => `<button class="pal${B.tool.kind === 'fx' && B.tool.key === f.key ? ' sel' : ''}" data-kind="fx" data-key="${f.key}"><span class="pi fx" style="--c:${f.color}">${f.short}</span><span class="pn">${f.name}</span></button>`).join('');
      html += `<button class="pal${B.tool.kind === 'erase' ? ' sel' : ''}" data-kind="erase"><span class="pi fx" style="--c:#5a4a6a">✕</span><span class="pn">Erase</span></button>`;
    } else {
      const n = tierNow().songs;
      html = DJ.songs.map((s, i) => {
        const buf = audio.bufs[`m:${s.track}`];
        const bpm = buf ? `${Math.round((32 * 60) / buf.duration)}` : '';
        if (i >= n) {
          const need = DJ.tiers.find((t) => t.songs > i);
          return `<button class="song locked" data-locked="${need ? need.name : ''}"><span class="sn">🔒 ${s.name}</span><span class="sb">${need ? need.name.toUpperCase() : ''}</span></button>`;
        }
        return `<button class="song${s.track === mix.track ? ' sel' : ''}" data-track="${s.track}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12" stroke="#ff5cc6" stroke-width="2.6" fill="none"/><circle cx="6.5" cy="17.5" r="3" fill="#ff5cc6"/><circle cx="16.5" cy="15.5" r="3" fill="#5cf2c8"/></svg><span class="sn">${s.name}</span><span class="sb">${bpm}</span></button>`;
      }).join('');
    }
    $('palette').innerHTML = html;
  }

  // ---- editing
  function paintCell(track, i) {
    const t = B.tool;
    if (track === 'music') return;
    let v = mix[track][i];
    if (t.kind === 'erase') v = null;
    else if (t.kind !== track) {
      flashTab(track);
      return;
    } else v = v === t.key && !B.painting ? null : t.key;
    if (mix[track][i] === v) return;
    mix[track][i] = v;
    refreshCell(track, i);
    if (v && !B.playing) {
      wake().then(() => {
        if (track === 'voice') { playVoice(v, 0); stageVoice(v); } else { playFx(v, 0); stageFx(v); }
      });
    }
  }
  function flashTab(track) {
    const tab = document.querySelector(`.tab[data-tab="${track}"]`);
    tab.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 300 });
    showToast(track === 'voice' ? 'Pick a squishy first' : 'Pick a sound first', `Choose one in ${track === 'voice' ? 'VOICES' : 'FX'}, then tap the beats.`);
  }
  // tap or drag across cells to fill them
  let painting = null;
  ['vCells', 'fCells'].forEach((id) => {
    const host = $(id);
    host.addEventListener('pointerdown', (e) => {
      const c = e.target.closest('.cell');
      if (!c) return;
      e.preventDefault();
      const track = c.dataset.track;
      const i = Number(c.dataset.i);
      const before = mix[track][i];
      B.painting = false;
      paintCell(track, i);
      // dragging fills (never clears) the cells it passes over
      painting = { track, filled: !!mix[track][i] && mix[track][i] !== before };
      try { host.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    host.addEventListener('pointermove', (e) => {
      if (!painting || !painting.filled) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const c = el && el.closest && el.closest('.cell');
      if (!c || c.dataset.track !== painting.track) return;
      const i = Number(c.dataset.i);
      if (mix[painting.track][i] === B.tool.key) return;
      B.painting = true;
      paintCell(painting.track, i);
      B.painting = false;
    });
    const end = () => { if (painting) { painting = null; changed(); } };
    host.addEventListener('pointerup', end);
    host.addEventListener('pointercancel', end);
  });
  $('mBars').addEventListener('click', (e) => {
    const b = e.target.closest('.bar');
    if (!b) return;
    const i = Number(b.dataset.bar);
    mix.music[i] = !mix.music[i];
    renderMixer();
    ui('tap', 0.5);
    changed();
  });
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    B.tab = t.dataset.tab;
    if (B.tab !== 'music' && B.tool.kind !== 'erase' && B.tool.kind !== B.tab) B.tool = B.tab === 'voice' ? { kind: 'voice', key: LINEUP[0].key } : { kind: 'fx', key: FX[0].key };
    renderPalette();
    wake().then(() => ui('tap', 0.4));
  }));
  $('palette').addEventListener('click', async (e) => {
    const p = e.target.closest('.pal, .song');
    if (!p) return;
    await wake();
    if (p.classList.contains('song')) {
      if (p.classList.contains('locked')) {
        ui('locked', 0.6);
        showToast('Song locked', `${p.dataset.locked} brings this song. Buy it in the Home Shop.`);
        return;
      }
      mix.track = p.dataset.track;
      renderPalette();
      updateTop();
      changed();
      if (B.playing) { stop(); play(); } else ui('select', 0.5);
      return;
    }
    const kind = p.dataset.kind;
    B.tool = kind === 'erase' ? { kind: 'erase' } : { kind, key: p.dataset.key };
    renderPalette();
    if (kind === 'voice') { playVoice(p.dataset.key, 0); stageVoice(p.dataset.key); }
    if (kind === 'fx') { playFx(p.dataset.key, 0); stageFx(p.dataset.key); }
  });
  function changed() {
    // the mix is kept for the next visit only when SAVE is pressed; this marks it unsaved
    $('save').querySelector('.sface').textContent = 'SAVE';
  }

  // ---- playing: a look-ahead scheduler on the audio clock
  let timer = 0;
  let raf = 0;
  const queue = [];
  const MUSIC_LEVEL = 0.55;
  async function play() {
    await wake();
    await loading;
    if (audio.failed) return;
    const buf = audio.bufs[`m:${mix.track}`];
    B.beat = buf.duration / 32;
    const ctx = audio.ctx;
    B.t0 = ctx.currentTime + 0.12;
    B.musicGain = ctx.createGain();
    B.musicGain.gain.value = mix.music[0] ? MUSIC_LEVEL : 0.0001;
    B.musicGain.connect(audio.master);
    B.music = ctx.createBufferSource();
    B.music.buffer = buf;
    B.music.loop = true;
    B.music.connect(B.musicGain);
    B.music.start(B.t0);
    B.nextStep = 0;
    B.nextTime = B.t0;
    B.playing = true;
    $('playLabel').textContent = '■ STOP';
    $('play').className = 'sticker st-red play';
    updateTop();
    timer = setInterval(tick, 25);
    tick();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (!B.playing) return;
    B.playing = false;
    clearInterval(timer);
    cancelAnimationFrame(raf);
    queue.length = 0;
    try {
      const t = audio.ctx.currentTime;
      B.musicGain.gain.cancelScheduledValues(t);
      B.musicGain.gain.setTargetAtTime(0.0001, t, 0.05);
      B.music.stop(t + 0.3);
    } catch (e) { /* ignore */ }
    B.step = -1;
    markStep(-1);
    $('playLabel').textContent = '▶ PLAY';
    $('play').className = 'sticker st-green play';
  }
  function tick() {
    const ctx = audio.ctx;
    while (B.nextTime < ctx.currentTime + 0.15) {
      const i = B.nextStep;
      const t = B.nextTime;
      const v = mix.voice[i];
      const f = mix.fx[i];
      // each bar's music on or off (a BREAK bar), set as its first beat is scheduled
      if (i % 4 === 0) B.musicGain.gain.setTargetAtTime(mix.music[i / 4] ? MUSIC_LEVEL : 0.0001, t - 0.01, 0.012);
      if (v) playVoice(v, t);
      if (f) playFx(f, t);
      queue.push({ t, i, v, f });
      B.nextStep = (i + 1) % STEPS;
      B.nextTime += B.beat;
    }
  }
  function frame() {
    if (!B.playing) return;
    const now = audio.ctx.currentTime;
    while (queue.length && queue[0].t <= now + 0.01) {
      const ev = queue.shift();
      B.step = ev.i;
      markStep(ev.i);
      onBeat(ev.i);
      if (ev.v) stageVoice(ev.v);
      if (ev.f) stageFx(ev.f);
    }
    raf = requestAnimationFrame(frame);
  }

  // ---- the stage's reactions
  function onBeat(i) {
    const scene = $('stageScene');
    if (!scene) return;
    paintFloor(scene, Math.floor(i / 1));
    const on = mix.music[Math.floor(i / 4)];
    if (on && !RM) {
      scene.querySelectorAll('.sq .hop').forEach((h, k) => h.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-6 - (k % 2) * 3}px)` }, { transform: 'translateY(0)' }], { duration: B.beat * 1000 * 0.9, easing: 'ease-out' }));
      scene.querySelector('.floor .glow').animate([{ opacity: 0.16 }, { opacity: 0.04 }], { duration: B.beat * 1000, easing: 'ease-out' });
    }
  }
  function stageVoice(key) {
    const el = sqEl(key);
    if (!el) return;
    el.querySelector('.squash').animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.22,0.72)', offset: 0.25 }, { transform: 'scale(0.92,1.12)', offset: 0.6 }, { transform: 'scale(1,1)' }], { duration: 380, easing: 'ease-out' });
    el.querySelector('.ring').animate([{ transform: 'translate(-50%,-50%) scale(0.5)', opacity: 0.9 }, { transform: 'translate(-50%,-50%) scale(1.3)', opacity: 0 }], { duration: 480, easing: 'ease-out' });
    const p = sqPoint(key);
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = Math.random() < 0.5 ? '♪' : '♫';
    n.style.setProperty('--c', BY_KEY[key].color);
    $('fxLayer').appendChild(n);
    const dx = (Math.random() - 0.5) * 30;
    n.animate([{ transform: `translate(${p.x}px,${p.y}px) scale(0.6)`, opacity: 0 }, { transform: `translate(${p.x + dx * 0.4}px,${p.y - 30}px) scale(1.1)`, opacity: 1, offset: 0.3 }, { transform: `translate(${p.x + dx}px,${p.y - 80}px) scale(0.9)`, opacity: 0 }], { duration: 900, easing: 'ease-out' }).finished.then(() => n.remove());
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function burst(x, y, colors, n = 10, dist = 40, star = false) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-0.3, 0.3);
      const d = rnd(dist * 0.6, dist);
      const s = rnd(5, 10);
      const p = document.createElement('div');
      p.className = 'part';
      p.style.cssText = `width:${s}px;height:${s}px;margin:${-s / 2}px 0 0 ${-s / 2}px;background:${colors[i % colors.length]};${star ? `border-radius:${s * 0.18}px;` : ''}`;
      $('fxLayer').appendChild(p);
      const r = star ? 45 : 0;
      p.animate([{ transform: `translate(${x}px,${y}px) rotate(${r}deg) scale(0.3)`, opacity: 1 }, { transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d + 10}px) rotate(${r}deg) scale(1)`, opacity: 0 }], { duration: 560, easing: 'ease-out' }).finished.then(() => p.remove());
    }
  }
  function stageFx(key) {
    const box = $('stage');
    if (!box || !$('stageScene')) return;
    const W = box.clientWidth;
    const H = box.clientHeight;
    const pick = LINEUP[Math.floor(Math.random() * LINEUP.length)].key;
    const p = sqPoint(pick);
    if (key === 'pop') burst(p.x, p.y, ['#ff8fd0', '#ffffff', '#ffe066', '#9ce8ff'], 10, 44);
    else if (key === 'sparkle') for (let k = 0; k < 3; k++) burst(rnd(W * 0.2, W * 0.8), rnd(H * 0.15, H * 0.6), ['#fff3a0', '#ffffff', '#ffd1f5', '#c9f5ff'], 6, 30, true);
    else if (key === 'coin') burst(W / 2, H * 0.35, ['#ffd23a', '#fff3a0', '#ffffff'], 14, 70, true);
    else if (key === 'bubble') {
      for (let k = 0; k < 6; k++) {
        const b = document.createElement('div');
        b.className = 'bubbleFx';
        const s = rnd(14, 26);
        b.style.cssText = `width:${s}px;height:${s}px;left:${rnd(W * 0.15, W * 0.85)}px;top:${H - 20}px`;
        $('fxLayer').appendChild(b);
        b.animate([{ transform: 'translateY(0) scale(0.6)', opacity: 0 }, { transform: `translateY(${-H * 0.3}px) scale(1)`, opacity: 1, offset: 0.3 }, { transform: `translate(${rnd(-20, 20)}px, ${-H * 0.8}px) scale(1.1)`, opacity: 0 }], { duration: 1400 + k * 80, easing: 'ease-out' }).finished.then(() => b.remove());
      }
    } else if (key === 'boing') {
      $('stageScene').querySelectorAll('.sq .squash').forEach((s, k) => s.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-26px) scale(0.95,1.08)', offset: 0.4 }, { transform: 'translateY(0) scale(1.1,0.9)', offset: 0.8 }, { transform: 'translateY(0)' }], { duration: 480, delay: k * 30, easing: 'ease-out' }));
    } else if (key === 'squeak') {
      const s = sqEl(pick).querySelector('.squash');
      s.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg) scale(1.05)' }, { transform: 'rotate(12deg)' }, { transform: 'rotate(0)' }], { duration: 360 });
    } else if (key === 'bonk') {
      box.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 300 });
    } else if (key === 'whoosh') {
      const s = document.createElement('div');
      s.className = 'sweep';
      $('fxLayer').appendChild(s);
      s.animate([{ transform: `translateX(${-W * 0.5}px)` }, { transform: `translateX(${W * 1.2}px)` }], { duration: 520, easing: 'ease-in-out' }).finished.then(() => s.remove());
    }
  }
  // a tap on a squishy: its voice now, and with REC on, written onto the nearest beat
  async function liveVoice(key) {
    await wake();
    playVoice(key, 0);
    stageVoice(key);
    if (B.rec && B.playing) {
      const i = ((Math.round((audio.ctx.currentTime - B.t0) / B.beat) % STEPS) + STEPS) % STEPS;
      mix.voice[i] = key;
      refreshCell('voice', i);
      changed();
    }
  }

  // ---- transport
  $('play').addEventListener('click', async () => {
    if (B.playing) stop();
    else play();
  });
  $('clear').addEventListener('click', async () => {
    await wake();
    ui('tap', 0.5);
    mix.voice = mix.voice.map(() => null);
    mix.fx = mix.fx.map(() => null);
    mix.music = [true, true, true, true];
    renderMixer();
    changed();
  });
  $('mixIt').addEventListener('click', async () => {
    await wake();
    ui('select', 0.5);
    // a fresh groove: voices on the beats in pairs, effects on the off-beats, one break
    const pair = [LINEUP[Math.floor(Math.random() * 5)].key, LINEUP[Math.floor(Math.random() * 5)].key];
    mix.voice = mix.voice.map((_, i) => (i % 2 === 0 && Math.random() < 0.8 ? pair[(i / 2) % 2] : i % 4 === 3 && Math.random() < 0.3 ? LINEUP[Math.floor(Math.random() * 5)].key : null));
    const fxPool = FX.map((f) => f.key);
    const main = fxPool[Math.floor(Math.random() * fxPool.length)];
    mix.fx = mix.fx.map((_, i) => (i % 2 === 1 && Math.random() < 0.6 ? (Math.random() < 0.6 ? main : fxPool[Math.floor(Math.random() * fxPool.length)]) : null));
    mix.music = [true, true, Math.random() < 0.6, true];
    renderMixer();
    changed();
  });
  $('rec').addEventListener('click', async () => {
    await wake();
    B.rec = !B.rec;
    $('rec').classList.toggle('on', B.rec);
    $('rec').setAttribute('aria-pressed', B.rec);
    ui('tap', 0.5);
    if (B.rec) showToast('Recording', 'Press PLAY, then tap the squishies on stage. Each tap lands on the nearest beat.');
  });
  $('save').addEventListener('click', async () => {
    await wake();
    save.mix = clone(mix);
    store();
    ui('save', 0.6);
    $('save').querySelector('.sface').textContent = 'SAVED ✓';
    showToast('Mix saved', "It'll be here the next time you open the soundboard.");
  });
  $('boardBack').addEventListener('click', () => { ui('tap', 0.5); closeBoard(); });
  window.addEventListener('keydown', (e) => {
    if ($('board').hidden || !$('overlay').hidden) return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  });

  // ---- cards, toast, the room-switch flash
  function showCard(html) {
    const o = $('overlay');
    o.innerHTML = `<div class="tint"></div><div class="card"><div class="cardRim"><div class="cardFill">${html}</div></div></div>`;
    o.hidden = false;
    o.querySelector('.tint').addEventListener('click', closeCard);
  }
  function closeCard() { $('overlay').hidden = true; $('overlay').innerHTML = ''; }
  let toastT = 0;
  function showToast(title, body, action) {
    const t = $('toast');
    t.innerHTML = `<div style="flex:1;min-width:0"><div class="tt">${title}</div><div class="tb">${body}</div></div>${action ? sticker('gold', action.label, 'toastAct', 'small') : ''}`;
    t.hidden = false;
    t.animate([{ transform: 'translate(-50%,-70px) scale(0.92)', opacity: 0 }, { transform: 'translate(-50%,0) scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' });
    if (action) $('toastAct').addEventListener('click', () => { t.hidden = true; action.fn(); });
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 3600);
  }
  async function roomFlash(change) {
    ui('room', 0.5);
    if (RM) { change(); return; }
    const f = $('flash');
    await f.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' }).finished;
    change();
    await wait(80);
    await f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, fill: 'forwards' }).finished;
  }

  // the Crib's floor steps slowly while nobody's playing (Dance.js: 1200 ms)
  setInterval(() => {
    if (!$('crib').hidden) {
      cribState.step++;
      const sc = $('cribSceneIn');
      if (sc) paintFloor(sc, cribState.step);
    } else if (!B.playing && $('stageScene')) {
      cribState.step++;
      paintFloor($('stageScene'), cribState.step);
    }
  }, 1200);
  window.addEventListener('resize', () => {
    clearTimeout(window.__rz);
    window.__rz = setTimeout(() => { if (!$('crib').hidden) renderCrib(); else renderStage(); }, 150);
  });

  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, wait(1500)]) : Promise.resolve();
  fontsReady.then(() => {
    renderCrib();
    loadAll(); // decoding can start before the first tap; playing waits for it
  });
  window.Soundboard = { B, mix: () => mix, audio, equip, tryOpen, play, stop };
})();
</script>
</body>
