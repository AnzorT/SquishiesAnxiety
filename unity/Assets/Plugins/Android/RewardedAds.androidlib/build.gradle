// Google Mobile Ads for the Unity app (App/Ads.cs): the rewarded ad, the version react-native-google-mobile-ads 14 uses.
apply plugin: 'com.android.library'

android {
    namespace 'com.plushcrush.unity.ads'
    // the manifest is at this folder's root, not in src/main: without this Gradle never reads it, the AdMob app id
    // never reaches the app, and Google Mobile Ads' MobileAdsInitProvider closes the app on start ("Missing
    // application ID")
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml' } }
    compileSdkVersion 35
    defaultConfig { minSdkVersion 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
}
