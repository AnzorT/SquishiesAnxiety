<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- The chest smash (REDESIGN_V6 step 6): the design's "Chest Smash v2" — its own chest engine
     (chest-models.js + chest-<group>.js: dents, cracks, holes, torn parts, burst, loot) and sounds
     (chest-sfx.js), copied unchanged by tools/chest/build.mjs — with the page's overlay rebuilt here
     without the design tool's framework. The server has already rolled the chest (squad groupChest
     and friends): this plays that result, upgrade included, and says when COLLECT is tapped.
     src/components/ChestSmash.js drives it: rigHost-style `chestHost.start({...})`. -->
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('fonts/Fredoka_700Bold.ttf'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url('fonts/Nunito_700Bold.ttf'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('fonts/Nunito_800ExtraBold.ttf'); }
  @font-face { font-family: 'Nunito'; font-weight: 900; src: url('fonts/Nunito_900Black.ttf'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a0f4a; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; font-family: 'Nunito', sans-serif; }
  @keyframes c2Slam { 0%{ transform:scale(2.6) rotate(-8deg); opacity:0;} 40%{ transform:scale(0.92) rotate(2deg); opacity:1;} 65%{ transform:scale(1.06) rotate(-1deg);} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  @keyframes c2Rise { from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes c2Hue { from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(360deg);} }
  @keyframes c2Fade { from{ opacity:0;} to{ opacity:1;} }
  @keyframes c2Rays { from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @keyframes c2Card { 0%{ transform:scale(0.2) rotate(-14deg); opacity:0;} 55%{ transform:scale(1.08) rotate(3deg); opacity:1;} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  @keyframes c2Bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  @keyframes c2Shine { 0%{ transform:translateX(-120%) skewX(-20deg);} 60%,100%{ transform:translateX(220%) skewX(-20deg);} }
  @keyframes c2Glow { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.25);} }
  .abs { position: absolute; }
  #stage { position: absolute; inset: 0; }
  #bg { position: absolute; inset: 0; }
  #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 27%; box-shadow: inset 0 4px 0 rgba(255,240,220,0.55); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #top { position: absolute; left: 0; right: 0; top: 0; padding: calc(var(--inset-top, 24px) + 28px) 16px 0; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; }
  #tierLabel { padding: 4px 14px; border-radius: 999px; background: #fff; font-weight: 900; font-size: 12px; letter-spacing: 1.4px; box-shadow: 0 3px 0 rgba(40,0,70,0.22); }
  #name { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.05; color: #fff; text-align: center; text-shadow: 1.5px 0 0 #45107a, -1.5px 0 0 #45107a, 0 1.5px 0 #45107a, 0 -1.5px 0 #45107a, 1.2px 1.2px 0 #45107a, -1.2px -1.2px 0 #45107a, 1.2px -1.2px 0 #45107a, -1.2px 1.2px 0 #45107a, 0 3px 0 #45107a; }
  #hpbar { display: flex; align-items: center; gap: 8px; width: 300px; max-width: 100%; box-sizing: border-box; padding: 5px 6px 5px 8px; border-radius: 999px; background: rgba(40,10,70,0.5); border: 2px solid rgba(255,255,255,0.7); }
  #pips { flex: 1; min-width: 0; display: flex; gap: 3px; }
  .pip { flex: 1; min-width: 0; height: 13px; border-radius: 7px; transition: background 0.2s; }
  #hp { flex-shrink: 0; padding: 2px 8px; border-radius: 999px; background: #fff; color: #45107a; font-weight: 900; font-size: 11px; }
  #bannerWrap { position: absolute; left: 0; right: 0; top: 30%; display: flex; justify-content: center; pointer-events: none; }
  .banner { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; line-height: 1; letter-spacing: 1px; color: #fff; }
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px calc(var(--inset-bottom, 0px) + 28px); display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; transition: opacity 0.3s; }
  #hint { padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #45107a; font-weight: 900; font-size: 14px; white-space: nowrap; box-shadow: 0 3px 0 rgba(90,40,10,0.25); animation: c2Rise 0.3s ease-out both; }
  #powerRow { align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 16px; background: rgba(40,10,70,0.5); border: 2px solid rgba(255,255,255,0.55); }
  #powerRow > span { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: #fff; letter-spacing: 0.5px; }
  #powTrack { position: relative; flex: 1; min-width: 0; height: 14px; border-radius: 7px; background: rgba(255,255,255,0.22); overflow: hidden; }
  #pow { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 7px; background: linear-gradient(90deg,#ffd23a,#ff5cc6); box-shadow: inset 0 2px 0 rgba(255,255,255,0.6); }
  #sup { flex-shrink: 0; min-width: 74px; text-align: center; padding: 3px 8px; border-radius: 999px; font-weight: 900; font-size: 11px; letter-spacing: 0.5px; }
  #reveal { position: absolute; inset: 0; z-index: 20; overflow: hidden; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 50% 42%, rgba(120,40,200,0.55) 0, rgba(28,6,56,0.92) 70%); animation: c2Fade 0.3s ease-out both; }
  #rays { position: absolute; left: 50%; top: 40%; width: 820px; height: 820px; margin: -410px 0 0 -410px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,230,140,0.32) 0 8deg, rgba(255,255,255,0) 8deg 20deg); -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 62%); mask-image: radial-gradient(circle, #000 15%, transparent 62%); animation: c2Rays 14s linear infinite; pointer-events: none; }
  #rvUp { position: relative; padding: 4px 14px; border-radius: 999px; background: #fff; font-weight: 900; font-size: 12px; letter-spacing: 1px; animation: c2Rise 0.4s 0.25s ease-out both; }
  #rvNew { position: relative; padding: 5px 16px; border-radius: 999px; background: linear-gradient(180deg,#ff8f8f,#e01e4a); border: 3px solid #fff; box-shadow: 0 3px 0 #8e1030; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 1px; color: #fff; animation: c2Rise 0.4s 0.35s ease-out both; }
  #card { position: relative; width: 250px; border-radius: 30px; border: 4px solid #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 14px 14px 16px; box-sizing: border-box; gap: 6px; animation: c2Card 0.6s cubic-bezier(0.2,0.9,0.3,1.2) both; }
  #cardShine { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.65),rgba(255,255,255,0)); animation: c2Shine 2.6s 0.6s ease-in-out infinite; pointer-events: none; }
  #art { position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; animation: c2Bob 2.4s ease-in-out infinite; }
  #art img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(60,20,110,0.25)); }
  #rvRar { padding: 3px 12px; border-radius: 999px; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
  #rvName { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; line-height: 1; color: #45107a; }
  #rvConcept { font-weight: 700; font-size: 12.5px; color: #6a4a9a; text-align: center; }
  #loot { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; animation: c2Rise 0.4s 0.5s ease-out both; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 2px #a04a00, 0 3px 0 2px #a04a00; }
  .coin { width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; background: radial-gradient(circle at 50% 42%, #fff6a8 0%, #ffd83a 42%, #ffb000 72%, #f08c00 100%); border: 2px solid #fff; box-shadow: 0 0 0 1px #a04a00; }
  .chip span { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #b86200; }
  #rvDupe { display: flex; align-items: center; padding: 6px 14px; border-radius: 999px; background: #fff3c4; box-shadow: 0 0 0 2px #a04a00, 0 3px 0 2px #a04a00; font-weight: 900; font-size: 13px; color: #8a4a00; }
  #rvPity { position: relative; font-weight: 900; font-size: 13px; color: #ffe27a; }
  #rvNew.copy { background: linear-gradient(180deg,#d9b8ff,#8f3cf2); box-shadow: 0 3px 0 #45189a; }
  #rvCopies { position: relative; width: 250px; display: none; flex-direction: column; align-items: center; gap: 5px; animation: c2Rise 0.4s 0.45s ease-out both; }
  #cpTrack { position: relative; width: 100%; height: 26px; border-radius: 13px; background: rgba(255,255,255,0.2); border: 3px solid #fff; box-sizing: border-box; overflow: hidden; box-shadow: 0 4px 0 rgba(20,0,50,0.45); }
  #cpFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 13px; background: linear-gradient(180deg,#ffd6f4 0%,#ff5cc6 45%,#c02bd9 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.6); transition: width 0.8s cubic-bezier(0.2,0.9,0.3,1.2); }
  #cpFill.full { background: linear-gradient(180deg,#d8ffc2 0%,#6fe07a 55%,#26a94e 100%); }
  #cpText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.8px; color: #fff; text-shadow: 0 1.5px 0 #45107a, 1px 0 0 #45107a, -1px 0 0 #45107a, 0 -1px 0 #45107a; }
  #cpNote { font-weight: 900; font-size: 13px; color: #ffe27a; text-align: center; }
  #collect { position: relative; overflow: hidden; width: 230px; height: 64px; border: 3px solid #fff; border-radius: 24px; background: linear-gradient(180deg,#d8ffc2 0%,#6fe07a 55%,#26a94e 100%); box-shadow: 0 0 0 2.5px #17652f, 0 6px 0 2.5px #17652f, 0 12px 20px rgba(20,80,40,0.35); font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 1px; color: #fff; text-shadow: 0 2.5px 0 #17652f, 2px 0 0 #17652f, -2px 0 0 #17652f; animation: c2Rise 0.4s 0.7s ease-out both; }
  #collect:active { transform: translateY(4px); }
</style>
<script src="chest-sfx.js"></script>
<script src="chest-models.js"></script>
<script src="chest-fruit.js"></script>
<script src="chest-ocean.js"></script>
<script src="chest-pet.js"></script>
<script src="chest-kit.js"></script>
<script src="chest-forest.js"></script>
<script src="chest-sky.js"></script>
<script src="chest-dream.js"></script>
<script src="chest-bakery.js"></script>
<script src="chest-heroes.js"></script>
<script src="chest-elemental.js"></script>
<script src="chest-spooky.js"></script>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="floor"></div>
  <canvas id="cv"></canvas>
  <div id="top">
    <div id="tierLabel"></div>
    <div id="name"></div>
    <div id="hpbar"><div id="pips"></div><div id="hp"></div></div>
  </div>
  <div id="bannerWrap"></div>
  <div id="bottom">
    <div id="hint"></div>
    <div id="powerRow"><span>POWER</span><div id="powTrack"><div id="pow"></div></div><div id="sup"></div></div>
  </div>
  <div id="reveal">
    <div id="rays"></div>
    <div id="rvUp"></div>
    <div id="rvNew">NEW SQUISHY!</div>
    <div id="card"><div id="cardShine"></div><div id="art"><img id="rvImg" alt=""></div><div id="rvRar"></div><div id="rvName"></div><div id="rvConcept"></div></div>
    <div id="rvCopies"><div id="cpTrack"><div id="cpFill"></div><div id="cpText"></div></div><div id="cpNote"></div></div>
    <div id="loot"><div class="chip"><div class="coin"></div><span id="rvCoins"></span></div><div id="rvDupe"></div></div>
    <div id="rvPity">Lucky meter paid out: guaranteed Epic or better!</div>
    <button id="collect">COLLECT</button>
  </div>
</div>
<script>
(function () {
  // Chest Smash v2's tables
  const TN = [
    { n: 'Common', c: '#8d7b6a', ink: '#5a4636' },
    { n: 'Rare', c: '#2f8cff', ink: '#0e4aa8' },
    { n: 'Epic', c: '#a24bf0', ink: '#5a1a9a' },
    { n: 'Legendary', c: '#f08c00', ink: '#9a4a00' },
    { n: 'Rainbow', c: '#e0459f', ink: '#8a1a6a' },
  ];
  const TI = { common: 0, rare: 1, epic: 2, legendary: 3, set: 4, rainbow: 4 };
  const GROUPS = {
    snack: { n: 'Snack Shack', bg: 'repeating-conic-gradient(#ffb59a 0 25%, #fff0e2 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#e7b88a 0%,#d39a68 40%,#b97c4c 100%)' },
    fruit: { n: 'Fruit Patch', bg: 'repeating-conic-gradient(#c4eba4 0 25%, #f4ffe6 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#a8dc78 0%,#7cc458 40%,#4f9a3c 100%)' },
    ocean: { n: 'Ocean Pals', bg: 'repeating-conic-gradient(#a8e2ff 0 25%, #eefaff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#f8e2ae 0%,#ecc884 40%,#cfa25e 100%)' },
    pet: { n: 'Pet Shop', bg: 'repeating-conic-gradient(#e6caff 0 25%, #fbf2ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#deae7e 0%,#c08a5c 40%,#98663c 100%)' },
    forest: { n: 'Forest Friends', bg: 'repeating-conic-gradient(#b8e0a0 0 25%, #f2fbe8 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#8ac86a 0%,#5fa848 40%,#3e7a30 100%)' },
    sky: { n: 'Sky & Stars', bg: 'repeating-conic-gradient(#b8c8ff 0 25%, #eef2ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#d8e4ff 0%,#b0c4f4 40%,#8a9ee0 100%)' },
    dream: { n: 'Dreamland', bg: 'repeating-conic-gradient(#e2d2ff 0 25%, #faf6ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#d8c8f4 0%,#bca8e8 40%,#9a84d0 100%)' },
    bakery: { n: 'Sweet Bakery', bg: 'repeating-conic-gradient(#bff0e2 0 25%, #fff8f0 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#f2d4b4 0%,#e0b48a 40%,#c08a5c 100%)' },
    heroes: { n: 'Masked Heroes', bg: 'repeating-conic-gradient(#ffc2c2 0 25%, #fff4ee 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#a8b4d0 0%,#7e8cb0 40%,#58668e 100%)' },
    elemental: { n: 'Elemental Heroes', bg: 'repeating-conic-gradient(#c8ccf0 0 25%, #f2f2fc 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#b8b2c0 0%,#8e8898 40%,#625c6e 100%)' },
    spooky: { n: 'Spooky Squish', bg: 'repeating-conic-gradient(#d8c2f4 0 25%, #f6f0fc 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#8a6aa8 0%,#6a4a8a 40%,#4a2e6a 100%)' },
  };
  const RCARD = ['#e6f5ff', '#e2fbef', '#f1e6ff', '#fff0dc', '#ffe9f6'], RLIP = ['#5a9ad2', '#38a878', '#8a5ae0', '#d08a20', '#d3179a'];
  const fmt = (n) => Number(n || 0).toLocaleString('en-US');
  const $ = (id) => document.getElementById(id);
  const post = (m) => { const s = JSON.stringify(m); if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s); else (window.__chestOut = window.__chestOut || []).push(m); };

  let S = null, run = null, st = null, pow = 0, bk = 0, bannerT = 0, revealT = 0;
  // st: { gk, start, final, tier, hp, max, name, phase, first, sup, reward }

  function paint() {
    if (!st) return;
    const T = TN[st.tier] || TN[2], G = GROUPS[st.gk] || GROUPS.ocean;
    $('bg').style.background = 'radial-gradient(circle at 50% 50%, rgba(255,250,232,0.92) 0, rgba(255,250,232,0) 50%), ' + G.bg;
    $('floor').style.background = G.floor;
    $('tierLabel').textContent = G.n.toUpperCase() + ' · ' + T.n.toUpperCase();
    $('tierLabel').style.color = T.c;
    $('name').textContent = st.name;
    const pips = $('pips'), max = Math.max(1, st.max);
    if (pips.children.length !== max) { pips.innerHTML = ''; for (let i = 0; i < max; i++) { const d = document.createElement('div'); d.className = 'pip'; pips.appendChild(d); } }
    [...pips.children].forEach((d, i) => { const on = i < st.hp; d.style.background = on ? '#7ee87a' : 'rgba(255,255,255,0.25)'; d.style.boxShadow = 'inset 0 -3px 0 ' + (on ? '#3aa83a' : 'rgba(0,0,0,0.15)') + ', inset 0 2px 0 rgba(255,255,255,0.55)'; });
    $('hp').textContent = st.hp + ' HP';
    const HINT = { idle: st.first && st.start <= 1 ? 'Tap to smash. The first tap might upgrade it!' : st.sup ? 'SUPER! Every tap hits double' : 'Keep tapping. Fast taps fill POWER', up: 'Upgrading… tap to skip', ko: 'Bursting open…', open: 'Opened!' };
    const hint = HINT[st.phase] || '';
    if ($('hint').textContent !== hint) { const h = $('hint'); h.textContent = hint; h.style.animation = 'none'; void h.offsetWidth; h.style.animation = ''; }
    $('bottom').style.opacity = st.phase === 'ko' || st.phase === 'open' ? 0.4 : 1;
    const sup = $('sup');
    sup.textContent = st.sup ? 'SUPER x' + st.sup : 'FILL IT';
    sup.style.background = st.sup ? 'linear-gradient(180deg,#fff7b0,#ffb000)' : 'rgba(255,255,255,0.2)';
    sup.style.color = st.sup ? '#7a3a00' : '#ffffff';
    sup.style.animation = st.sup ? 'c2Glow 0.7s ease-in-out infinite' : 'none';
  }

  function banner(text, tier) {
    clearTimeout(bannerT);
    const ink = TN[tier].ink, glow = TN[tier].c, w = $('bannerWrap');
    w.innerHTML = '';
    const b = document.createElement('div');
    b.className = 'banner'; b.textContent = text; b.dataset.k = ++bk;
    b.style.textShadow = ['3px 0 0', '-3px 0 0', '0 3px 0', '0 -3px 0', '2.4px 2.4px 0', '-2.4px -2.4px 0', '2.4px -2.4px 0', '-2.4px 2.4px 0', '0 7px 0', '0 0 28px'].map((s) => s + ' ' + ink).join(', ') + ', 0 0 54px ' + glow;
    b.style.animation = tier === 4 ? 'c2Slam 0.6s cubic-bezier(0.2,0.9,0.3,1.2) both, c2Hue 2s linear infinite' : 'c2Slam 0.6s cubic-bezier(0.2,0.9,0.3,1.2) both';
    w.appendChild(b);
    bannerT = setTimeout(() => (w.innerHTML = ''), 1500);
  }

  function showReveal() {
    const rw = st.reward || {}, T = TN[st.tier] || TN[2], G = GROUPS[st.gk] || GROUPS.ocean;
    $('rvUp').style.display = st.tier > st.start ? '' : 'none';
    $('rvUp').textContent = 'UPGRADED TO ' + T.n.toUpperCase() + '!';
    $('rvUp').style.color = T.c;
    // a copy toward unlocking it (+1 COPY and the bar), the copy that unlocks
    // it (UNLOCKED!), or one that came whole (NEW SQUISHY!)
    const copy = !rw.isNew && rw.copies > 0;
    const counted = rw.need > 1 && (copy || rw.isNew);
    $('rvNew').style.display = rw.isNew || copy ? '' : 'none';
    $('rvNew').textContent = copy ? '+1 COPY' : counted ? 'UNLOCKED!' : 'NEW SQUISHY!';
    $('rvNew').className = copy ? 'copy' : '';
    $('rvCopies').style.display = counted ? 'flex' : 'none';
    if (counted) {
      const fill = $('cpFill'), n = Math.min(rw.copies, rw.need);
      fill.className = n >= rw.need ? 'full' : '';
      fill.style.transition = 'none';
      fill.style.width = (((n - 1) / rw.need) * 100).toFixed(1) + '%';
      void fill.offsetWidth;
      fill.style.transition = '';
      setTimeout(() => (fill.style.width = ((n / rw.need) * 100).toFixed(1) + '%'), 900);
      $('cpText').textContent = n + ' / ' + rw.need;
      const left = rw.need - n;
      $('cpNote').textContent = left > 0 ? 'Find ' + left + ' more to unlock ' + rw.name + '!' : rw.name + ' joins your squad!';
    }
    const has = !!rw.name;
    $('card').style.background = has ? (RCARD[rw.rar] || '#ffffff') : '#ffffff';
    $('card').style.boxShadow = '0 0 0 3px ' + (has ? RLIP[rw.rar] || '#8e1580' : '#8e1580') + ', 0 8px 0 3px ' + (has ? RLIP[rw.rar] || '#8e1580' : '#8e1580') + ', 0 0 50px 10px rgba(255,220,120,0.45)';
    $('rvImg').style.display = rw.img ? '' : 'none';
    if (rw.img) $('rvImg').src = rw.img;
    $('rvRar').textContent = has ? rw.rarLabel : G.n.toUpperCase();
    $('rvRar').style.background = has ? rw.rarBg : '#ffffff';
    $('rvRar').style.color = has ? rw.rarInk : '#45107a';
    $('rvName').textContent = has ? rw.name : 'Loot!';
    $('rvConcept').textContent = rw.concept || '';
    $('rvCoins').textContent = '+' + fmt((rw.coins || 0) + (rw.dupeCoins || 0) + (rw.setBonus || 0));
    $('rvDupe').style.display = !rw.isNew && rw.dupeCoins ? '' : 'none';
    $('rvDupe').textContent = '+' + fmt(rw.dupeCoins || 0) + ' for a duplicate';
    $('rvPity').style.display = rw.luck ? '' : 'none';
    // restart the card's entrance animations
    $('reveal').style.display = 'none'; void $('reveal').offsetWidth; $('reveal').style.display = 'flex';
    // where COLLECT ends up (after its entrance), for the app's tutorial
    setTimeout(() => { const r = $('collect').getBoundingClientRect(); post({ type: 'reveal', collect: { x: r.left, y: r.top, w: r.width, h: r.height } }); }, 1150);
  }

  function ev(e) {
    if (!st) return;
    if (e.type === 'loaded') Object.assign(st, { tier: e.tier, hp: e.hp, max: e.max, name: e.name });
    else if (e.type === 'hp') Object.assign(st, { hp: e.hp, max: e.max });
    else if (e.type === 'step') { Object.assign(st, { tier: e.tier, hp: e.hp, max: e.max, name: e.name }); banner(TN[e.tier].n.toUpperCase() + '!', e.tier); post({ type: 'step', tier: e.tier }); }
    else if (e.type === 'upgradeDone') st.phase = 'idle';
    else if (e.type === 'koStart') { st.phase = 'ko'; st.sup = 0; }
    else if (e.type === 'ko') {
      st.phase = 'open'; banner('OPENED!', e.tier); post({ type: 'opened' });
      clearTimeout(revealT); revealT = setTimeout(showReveal, 1700);
    }
    paint();
  }

  function tap(e) {
    if (!S || !st) return;
    if (st.phase === 'up') { S.skipUp(); return; }
    if (st.phase !== 'idle') return;
    if (st.first) {
      st.first = false;
      // the server's upgrade (rolled at the purchase), played on the first tap
      if (st.final > st.tier) { st.phase = 'up'; paint(); S.upgrade(st.final); post({ type: 'upgrade', to: st.final }); return; }
    }
    let P = 1, dbl = false;
    if (st.sup > 0) { P = 1.7; dbl = true; st.sup = Math.max(0, st.sup - 1); }
    else { pow += 0.25; if (pow >= 1) { pow = 0; st.sup = 3; banner('SUPER!', 3); } }
    S.hitAt(e.clientX, e.clientY, P);
    if (dbl && S.hp > 0) S.hitAt(e.clientX + (Math.random() * 40 - 20), e.clientY + (Math.random() * 30 - 15), 1.3);
    paint();
    post({ type: 'hit' });
  }
  $('cv').addEventListener('pointerdown', tap);
  $('collect').addEventListener('click', () => post({ type: 'collect' }));

  // the POWER bar drains
  let last = performance.now();
  const loop = (t) => { requestAnimationFrame(loop); const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t; pow = Math.max(0, pow - dt * 0.22); $('pow').style.width = (Math.min(1, pow) * 100).toFixed(1) + '%'; };
  requestAnimationFrame(loop);

  window.chestHost = {
    // { group, size, final, reward: { name, rar, rarLabel, rarBg, rarInk, concept, img, isNew, copies, need, coins, dupeCoins, setBonus, luck }, sound, insetTop, insetBottom }
    // (img: the creature's front art, ../rig/export/tripo/<key>/<key>-front.svg)
    start(o) {
      clearTimeout(revealT); clearTimeout(bannerT);
      $('bannerWrap').innerHTML = ''; $('reveal').style.display = 'none';
      document.documentElement.style.setProperty('--inset-top', (o.insetTop || 0) + 'px');
      document.documentElement.style.setProperty('--inset-bottom', (o.insetBottom || 0) + 'px');
      const gk = GROUPS[o.group] ? o.group : 'ocean', start = TI[o.size] ?? 0, final = Math.max(start, TI[o.final] ?? start);
      st = { gk, start, final, tier: start, hp: 0, max: 1, name: '', phase: 'idle', first: true, sup: 0, reward: o.reward || null };
      pow = 0;
      const CM = window.ChestModels;
      if (!S) { S = new CM.Stage($('cv'), { group: gk, ground: 0.73, top: 178 + (o.insetTop || 0), onEvent: ev }); S.load(gk, start, true); }
      else S.reset(gk, start);
      S.sound = o.sound !== false;
      paint();
    },
    sound(on) { if (S) S.sound = !!on; },
  };

  const boot = () => { const CM = window.ChestModels; if (CM && Object.keys(GROUPS).every((g) => CM.groups.includes(g))) post({ type: 'ready' }); else setTimeout(boot, 30); };
  boot();
})();
</script>
</body>
