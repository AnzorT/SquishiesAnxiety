# The Unity version of the app (unity/): screenshots of each ported screen compared with the current app, and an APK.
# Needs a Unity license as repository secrets (Settings > Secrets and variables > Actions), see unity/README.md:
#   Personal: UNITY_LICENSE (the contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD
#   Plus/Pro: UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD
# Without them every job stops at its first step with a note.
name: Unity

on:
  push:
    paths: ['unity/**', 'tools/unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write   # the screenshots go to the branch unity-shots/<branch>, so they can be fetched and looked at

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
    steps:
      - name: License check
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "### No Unity license yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Add UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL and UNITY_PASSWORD as repository secrets; see unity/README.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
      - name: Unity version
        if: env.HAS_LICENSE == 'true'
        run: |
          echo "UNITY_VERSION=$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: library-linux-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: library-linux-${{ env.UNITY_VERSION }}-
      - name: Screenshots in Unity
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e UNITY_LICENSE -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD \
            "unityci/editor:ubuntu-${UNITY_VERSION}-base-3" \
            bash unity/ci/unity.sh SquishSquad.EditorTools.CiBuild.CaptureMenu
          sudo chown -R "$(id -u):$(id -g)" unity
          ls -la unity/CiOut
      - uses: actions/setup-node@v4
        if: env.HAS_LICENSE == 'true'
        with:
          node-version: 22
      - name: Compare with the current app
        if: env.HAS_LICENSE == 'true'
        run: |
          npm install --no-save --no-audit --no-fund pngjs@7 >/dev/null
          set +e
          node tools/unity/compare.mjs unity/Reference/menu-a15.png unity/CiOut/menu-a15.png unity/CiOut/menu-a15-diff.png --max-share 2 | tee compare.txt
          echo "COMPARE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          { echo "### Main Menu, Unity vs the app (Galaxy A15, 2340x1080)"; cat compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: env.HAS_LICENSE == 'true'
        with:
          name: unity-screenshots
          path: unity/CiOut/
      - name: Publish the screenshots to unity-shots/${{ github.ref_name }}
        if: env.HAS_LICENSE == 'true'
        run: |
          set -e
          dir=$(mktemp -d)
          cp unity/CiOut/*.png "$dir"/
          cp compare.txt "$dir"/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > "$dir/source-commit.txt"
          cd "$dir"
          git init -q -b shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Unity screenshots of ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "shots:refs/heads/unity-shots/${{ github.ref_name }}"
      - name: Fail on a real difference
        if: env.HAS_LICENSE == 'true'
        run: exit "${COMPARE_EXIT:-1}"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
    steps:
      - name: License check
        run: '[ "$HAS_LICENSE" = "true" ] || echo "No Unity license secrets yet: skipping the APK (see unity/README.md)" >> "$GITHUB_STEP_SUMMARY"'
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: env.HAS_LICENSE == 'true'
        with:
          android: false
          tool-cache: false
      - uses: actions/checkout@v4
        if: env.HAS_LICENSE == 'true'
      - uses: actions/cache@v4
        if: env.HAS_LICENSE == 'true'
        with:
          path: unity/Library
          key: library-android-${{ hashFiles('unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: library-android-
      - uses: game-ci/unity-builder@v4
        if: env.HAS_LICENSE == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildMethod: SquishSquad.EditorTools.CiBuild.BuildAndroid
          buildName: SquishSquad
      - uses: actions/upload-artifact@v4
        if: env.HAS_LICENSE == 'true'
        with:
          name: squish-squad-unity-apk
          path: build/Android/
